<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRECE+ Suite Comercial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap">
<style>
  :root{--p900:#130326;--p800:#1e0540;--p700:#3b0764;--p600:#6b21a8;--p500:#9333ea;--p400:#c084fc;--gold:#f5c518;--gold2:#fbbf24}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;display:flex;height:100vh;overflow:hidden;background:var(--p900);color:#fff}
  .side{width:216px;flex:none;background:linear-gradient(180deg,var(--p900),#1a043a 60%,#24074a);
    border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;padding:22px 14px}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:22px;color:#fff;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;
    padding:12px 14px;text-align:center;letter-spacing:-.01em;margin-bottom:8px}
  .brand sup{color:var(--gold2);font-size:13px}
  .side .subt{font-size:11px;color:rgba(255,255,255,.4);text-align:center;letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:22px}
  nav{display:flex;flex-direction:column;gap:6px}
  .nav-item{display:flex;align-items:center;gap:11px;font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;
    color:rgba(255,255,255,.7);background:transparent;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;
    text-align:left;transition:.15s;width:100%}
  .nav-item .ic{font-size:17px;line-height:1}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:var(--gold);color:var(--p900)}
  .side-foot{margin-top:auto;font-size:11px;color:rgba(255,255,255,.35);text-align:center;line-height:1.5}
  .stage{flex:1;position:relative;background:var(--p900)}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--p900)}
  .stage iframe[hidden]{display:none}
  .user-badge{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:9px 11px;margin-bottom:8px;text-align:left}
  .user-badge .ub-email{font-size:11px;color:#fff;font-weight:600;word-break:break-all;line-height:1.3}
  .user-badge .ub-rol{font-size:10px;color:var(--gold2);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;font-weight:700}
  .logout-btn{width:100%;background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.65);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:.15s}
  .logout-btn:hover{border-color:rgba(255,255,255,.5);color:#fff}
  /* AUTH GATE */
  #auth-gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--p900) 0%,var(--p800) 45%,#2e0652 100%);padding:24px}
  #auth-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:40px 34px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .ag-logo{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:26px;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px;display:inline-block;margin-bottom:12px}
  .ag-logo sup{color:var(--gold2);font-size:15px}
  .ag-sub{font-size:12px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.18em;margin-bottom:18px}
  .ag-h{font-family:'Space Grotesk',sans-serif;color:#fff;font-size:20px;margin-bottom:10px}
  .ag-txt{color:rgba(255,255,255,.6);font-size:14px;line-height:1.6;margin-bottom:22px}
  .ag-txt b{color:#fff}
  .ag-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--gold);color:var(--p900);border:none;border-radius:40px;padding:13px 20px;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:15px;cursor:pointer;transition:.15s}
  .ag-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(245,197,24,.4)}
  .ag-btn.alt{background:transparent;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.25)}
  .ag-btn .ag-g{background:#fff;color:#4285F4;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
  @media(max-width:760px){
    body{flex-direction:column}
    .side{width:100%;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto}
    .brand{margin:0 10px 0 0;padding:8px 12px;font-size:17px}
    .side .subt{display:none} nav{flex-direction:row;gap:6px}
    .nav-item{padding:9px 12px;white-space:nowrap}
  }
</style>
</head>
<body>
  <div id="auth-gate"><div id="auth-box"><p class="ag-txt">Cargando…</p></div></div>
  <aside class="side">
    <div class="brand">CRECE<sup>+</sup></div>
    <div class="subt">Suite comercial</div>
    <nav>
      <button class="nav-item active" data-t="cot"><span class="ic">&#129518;</span> Cotizador</button>
      <button class="nav-item" data-t="bench"><span class="ic">&#128202;</span> Benchmark</button>
      <button class="nav-item" data-t="equipos"><span class="ic">&#128187;</span> Equipos</button>
      <button class="nav-item" data-t="oportunidades"><span class="ic">&#128200;</span> Oportunidades</button>
      <button class="nav-item" data-t="comis"><span class="ic">&#128176;</span> Comisiones</button>
      <button class="nav-item" data-t="historial"><span class="ic">&#128202;</span> Historial</button>
      <button class="nav-item" data-t="usuarios"><span class="ic">&#128100;</span> Usuarios</button>
    </nav>
    <div class="side-foot">CRECE+<br>Chile &middot; Per&uacute; &middot; Colombia</div>
  </aside>
  <main class="stage">
    <iframe id="f-cot" title="Cotizador" srcdoc="<!DOCTYPE html>
<html lang=&quot;es&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>Cotizador POS – CRECE+</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=Space+Grotesk:wght@400;500;600;700;800&amp;display=swap');

:root {
  --p900:#130326;--p800:#1e0540;--p700:#3b0764;--p600:#6b21a8;--p500:#9333ea;--p400:#c084fc;--p300:#e9d5ff;--p100:#f5f0ff;
  --gold:#f5c518;--gold2:#fbbf24;--gold-light:#fde68a;
  --white:#ffffff;--g50:#faf8ff;--g100:#f3f0fa;--g200:#e5dff5;--g400:#9d8ec4;--g600:#5b4e7a;--g800:#2d2045;
  --green:#16a34a;--green-bg:#f0fdf4;--red:#dc2626;--amber:#d97706;--blue:#2563eb;--blue-bg:#eff6ff;
  --r:14px;--r-sm:8px;--sh:0 4px 24px rgba(107,33,168,.14);--sh-lg:0 12px 48px rgba(107,33,168,.22);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(160deg,var(--p900) 0%,var(--p800) 45%,#2e0652 100%);min-height:100vh;padding:24px 16px 60px;color:var(--g800)}

/* HEADER */
.header{text-align:center;margin-bottom:28px}
.logos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.logo-dolpos{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:18px;color:var(--white);border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 16px}
.logo-crece{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:18px;color:var(--p600);background:var(--white);border-radius:10px;padding:6px 16px}
.logo-crece sup{color:var(--gold2);font-size:12px}
.sep{color:rgba(255,255,255,.25);font-size:22px}
.header h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,5vw,34px);font-weight:800;color:var(--white);line-height:1.1}
.header h1 em{font-style:normal;color:var(--gold)}
.header p{color:rgba(255,255,255,.55);font-size:14px;margin-top:8px}

.wrapper{max-width:920px;margin:0 auto}

/* PROGRESS */
.progress-wrap{margin-bottom:20px}
.progress-steps{display:flex;align-items:center;justify-content:center}
.step-node{display:flex;flex-direction:column;align-items:center;gap:5px;z-index:1}
.step-node .dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;border:2px solid rgba(255,255,255,.2);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);transition:all .3s}
.step-node.active .dot{background:var(--gold);color:var(--p900);border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,197,24,.25)}
.step-node.done .dot{background:var(--p500);color:white;border-color:var(--p500)}
.step-node .lbl{font-size:9px;color:rgba(255,255,255,.35);white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.step-node.active .lbl{color:var(--gold-light)}
.step-node.done .lbl{color:var(--p400)}
.step-line{flex:1;height:2px;background:rgba(255,255,255,.12);margin:0 3px;margin-bottom:20px;transition:background .3s;min-width:8px;max-width:55px}
.step-line.done{background:var(--p500)}

/* CARD */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card-head{padding:20px 26px 16px;border-bottom:1px solid var(--g100);position:relative}
.paso-pais{position:absolute;top:20px;right:26px;display:inline-flex;align-items:center;gap:7px;background:var(--g50);border:1px solid var(--g200);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--g800)}
.paso-pais .fl{font-size:15px;line-height:1}
.paso-pais:empty{display:none}
@media(max-width:480px){.paso-pais{position:static;margin-top:10px}}
.step-label{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--p500);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.step-label::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:2px;display:inline-block}
.card-head h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:var(--g800)}
.card-head p{font-size:13px;color:var(--g400);margin-top:4px;line-height:1.5}
.card-body{padding:22px 26px}
.card-nav{padding:14px 26px;border-top:1px solid var(--g100);display:flex;justify-content:space-between;align-items:center;gap:12px}

/* PAÍS */
.pais-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:520px){.pais-grid{grid-template-columns:1fr}}
.pais-opt{border:2px solid var(--g200);border-radius:var(--r);padding:18px 14px;cursor:pointer;transition:all .2s;text-align:center;background:var(--white)}
.pais-opt:hover{border-color:var(--p400);background:var(--p100)}
.pais-opt.selected{border-color:var(--p500);background:var(--p100);box-shadow:0 0 0 3px rgba(147,51,234,.12)}
.pais-flag{font-size:32px;display:block;margin-bottom:7px}
.pais-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--g800);margin-bottom:2px}
.pais-moneda{font-size:12px;color:var(--g400);font-weight:500}
.pais-tax{font-size:11px;color:var(--p500);font-weight:600;margin-top:4px}

/* TASAS */
.tasas-wrap{background:var(--g50);border:1.5px solid var(--g200);border-radius:var(--r-sm);padding:16px 18px}
.tasas-title{font-size:12px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tasas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.tasa-field{display:flex;flex-direction:column;gap:5px}
.tasa-field label{font-size:12px;font-weight:600;color:var(--g600)}
.tasa-input-wrap{display:flex;align-items:center;gap:6px}
.tasa-input-wrap input{width:105px;height:36px;border:1.5px solid var(--g200);border-radius:var(--r-sm);padding:0 10px;font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--g800);outline:none;transition:border-color .15s}
.tasa-input-wrap input:focus{border-color:var(--p500)}
.tasa-input-wrap span{font-size:11px;color:var(--g400);font-weight:500}

/* INPUTS */
.txt-input{height:44px;border:2px solid var(--g200);border-radius:var(--r-sm);padding:0 14px;font-size:15px;font-family:inherit;color:var(--g800);outline:none;width:100%;transition:border-color .15s}
.txt-input:focus{border-color:var(--p500)}
.field-group{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:560px){.field-group{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:7px}
.field>label{font-size:13px;font-weight:600;color:var(--g800)}
.field .sub{font-size:12px;color:var(--g400);font-weight:400;margin-top:-3px}

/* STEPPER */
.stepper{display:inline-flex;align-items:center;border:2px solid var(--g200);border-radius:var(--r-sm);overflow:hidden;width:fit-content}
.stepper button{width:36px;height:36px;background:var(--g50);border:none;cursor:pointer;font-size:18px;font-weight:600;color:var(--p600);transition:background .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stepper button:hover{background:var(--p300)}
.stepper button:disabled{color:var(--g200);cursor:default;background:var(--g50)}
.stepper .num{min-width:46px;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:var(--g800);background:var(--white);padding:0 3px;line-height:36px}
.stepper input.num{width:74px;min-width:74px;height:36px;border:none;outline:none;-moz-appearance:textfield}
.stepper input.num::-webkit-outer-spin-button,.stepper input.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input.num:focus{background:#f3effe}

/* GRID EMPRESAS */
.sucursales-grid{display:flex;flex-direction:column;gap:10px}
.suc-row{display:flex;align-items:center;gap:14px;padding:13px 15px;background:var(--g50);border:1.5px solid var(--g200);border-radius:var(--r-sm);transition:border-color .2s}
.suc-row:hover{border-color:var(--p400)}
.suc-icon{width:34px;height:34px;border-radius:8px;background:var(--p100);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.suc-info{flex:1;min-width:0}
.suc-info .suc-name{font-weight:600;font-size:14px;color:var(--g800)}
.suc-info .suc-sub{font-size:12px;color:var(--g400);margin-top:1px}

/* ══ PASO 4: USUARIOS ══ */
.usr-detail-grid{display:flex;flex-direction:column;gap:16px}
.emp-separator{display:flex;align-items:center;gap:10px;padding:4px 0}
.emp-separator-line{flex:1;height:1px;background:var(--g200)}
.emp-separator-label{font-size:11px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}

/* Card por sucursal */
.usr-suc-card{border:1.5px solid var(--g200);border-radius:var(--r);overflow:hidden}
.usr-suc-header{display:flex;align-items:center;gap:10px;padding:11px 15px;background:var(--p700)}
.ush-icon{font-size:17px}
.ush-name{font-weight:700;font-size:14px;color:var(--white);flex:1}
.ush-emp{font-size:11px;color:rgba(255,255,255,.5)}

/* Tabla de roles dentro de cada sucursal */
.roles-table{width:100%;border-collapse:collapse}
.roles-table tr{border-bottom:1px solid var(--g100)}
.roles-table tr:last-child{border-bottom:none}
.roles-table td{padding:10px 15px;vertical-align:middle}
.role-info{display:flex;align-items:center;gap:10px}
.role-icon-wrap{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.role-icon-wrap.admin{background:rgba(107,33,168,.1)}
.role-icon-wrap.sup{background:rgba(22,163,74,.1)}
.role-icon-wrap.vend{background:rgba(37,99,235,.08)}
.role-name{font-size:13px;font-weight:700;color:var(--g800)}
.role-desc{font-size:11px;color:var(--g400);margin-top:2px;line-height:1.4}
.role-price-col{text-align:right;white-space:nowrap}
.role-price-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:4px}
.role-price-tag.free{background:var(--green-bg);color:var(--green)}
.role-price-tag.cost-admin{background:rgba(107,33,168,.1);color:var(--p600)}
.role-price-tag.cost-sup{background:rgba(245,197,24,.12);color:var(--amber)}
.role-price-tag.cost-vend{background:var(--blue-bg);color:var(--blue)}
.role-ctrl{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:6px}
.role-base-tag{font-size:10px;color:var(--g400);font-style:italic}

/* FREE indicator */
.free-indicator{display:flex;align-items:center;justify-content:flex-end}
.free-check{font-size:18px;color:var(--green)}

/* BOTONES */
.btn-back{background:transparent;border:1.5px solid var(--g200);border-radius:40px;padding:9px 20px;font-size:14px;font-weight:600;color:var(--g400);cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.btn-back:hover{border-color:var(--g400);color:var(--g600)}
.btn-next{background:linear-gradient(135deg,var(--p600) 0%,var(--p500) 100%);color:var(--white);border:none;border-radius:40px;padding:10px 26px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;box-shadow:0 4px 14px rgba(107,33,168,.3)}
.btn-next:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(107,33,168,.4)}
.btn-next:active{transform:translateY(0)}
.btn-next:disabled{background:var(--g200);color:var(--g400);box-shadow:none;cursor:default;transform:none}

/* RESULTADO */
.result-wrap{display:flex;flex-direction:column;gap:16px}
.result-hero{background:linear-gradient(135deg,var(--p900) 0%,var(--p700) 100%);border-radius:var(--r);padding:26px;color:var(--white);box-shadow:var(--sh-lg);position:relative;overflow:hidden}
.result-hero::after{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(245,197,24,.12) 0%,transparent 65%);pointer-events:none}
.result-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:18px}
.result-plan-badge{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--p900);font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:17px;padding:7px 17px;border-radius:40px}
.pais-badge-res{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:4px 12px;font-size:12px;color:rgba(255,255,255,.8);margin-bottom:10px}
.tasas-res{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:var(--r-sm);padding:12px 14px;min-width:190px}
.tasas-res-title{font-size:10px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.tasa-row-res{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:5px}
.tasa-row-res:last-child{margin-bottom:0}
.tasa-row-res label{font-size:11px;color:rgba(255,255,255,.5)}
.tasa-row-res input{width:86px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:3px 7px;font-size:13px;font-weight:700;color:var(--white);text-align:right;outline:none;font-family:'Space Grotesk',sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 12px;text-align:center}
.chip .cv{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:var(--gold);display:block}
.chip .cl{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px}
.desglose{background:rgba(255,255,255,.06);border-radius:var(--r-sm);padding:14px 16px}
.drow{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:13px;color:rgba(255,255,255,.75);border-bottom:1px solid rgba(255,255,255,.06)}
.drow:last-child{border-bottom:none}
.drow.dim{font-size:12px;opacity:.62}
.drow.free-row{font-size:12px;opacity:.52}
.drow.sep-row{border-top:1px solid rgba(255,255,255,.15);margin-top:4px;padding-top:10px;border-bottom:none}
.drow.grand{font-size:15px;font-weight:700;color:var(--white);border-bottom:none;margin-top:4px}
.drow .dv{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--white);text-align:right}
.drow.grand .dv{color:var(--gold);font-size:21px;font-weight:800}
.drow.desc-line .dv{color:#fca5a5}
/* Checkbox habilitar descuento (Paso 5) */
.chk-field{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;color:var(--g800)}
.chk-field input{width:18px;height:18px;accent-color:var(--p600);cursor:pointer}
/* Control de descuento (Paso 6, no-export) */
#desc-control{background:rgba(245,197,24,.10);border:1px solid rgba(245,197,24,.35);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:12px}
.desc-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.desc-lbl{font-weight:700;color:#fde68a;font-size:13px;margin-right:auto}
.desc-seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:2px;gap:2px}
.desc-seg button{border:0;background:transparent;color:rgba(255,255,255,.7);font-weight:700;font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer}
.desc-seg button.active{background:var(--gold);color:var(--p900)}
.desc-inp{display:inline-flex;align-items:center;gap:6px;background:var(--white);border-radius:8px;padding:2px 10px}
.desc-inp span{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--p600);font-size:14px}
.desc-inp input{width:90px;border:0;outline:none;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--g800);padding:6px 0;-moz-appearance:textfield}
.desc-inp input::-webkit-outer-spin-button,.desc-inp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* TABLA SUCURSALES */
.suc-breakdown{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.suc-breakdown table{width:100%;border-collapse:collapse}
.suc-breakdown thead tr{background:var(--p700)}
.suc-breakdown thead th{padding:10px 13px;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:rgba(255,255,255,.75);text-align:left}
.suc-breakdown thead th:last-child{text-align:right}
.suc-breakdown tbody tr{border-bottom:1px solid var(--g100);transition:background .15s}
.suc-breakdown tbody tr:hover{background:var(--g50)}
.suc-breakdown tbody tr:last-child{border-bottom:none}
.suc-breakdown td{padding:9px 13px;font-size:12px;color:var(--g600);vertical-align:middle}
.suc-breakdown td:last-child{text-align:right;font-weight:600;color:var(--g800);font-family:'Space Grotesk',sans-serif}
.suc-name-cell{font-weight:700 !important;color:var(--g800) !important;font-size:13px !important}
.mini-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin:2px}
.mb-admin{background:rgba(107,33,168,.1);color:var(--p600)}
.mb-sup{background:rgba(22,163,74,.1);color:var(--green)}
.mb-vend{background:var(--blue-bg);color:var(--blue)}
.mb-extra{background:rgba(245,197,24,.15);color:var(--amber)}

/* RESUMEN ROLES */
.roles-summary{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.rs-head{background:var(--p700);padding:14px 20px}
.rs-head-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--white)}
.rs-head-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
.rs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0}
.rs-item{padding:16px 20px;border-right:1px solid var(--g100);border-bottom:1px solid var(--g100)}
.rs-item:last-child{border-right:none}
.rs-item-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rs-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rs-icon.admin{background:rgba(107,33,168,.1)}
.rs-icon.sup{background:rgba(22,163,74,.1)}
.rs-icon.vend{background:var(--blue-bg)}
.rs-item-name{font-weight:700;font-size:14px;color:var(--g800)}
.rs-item-price{font-size:12px;font-weight:600;margin-top:1px}
.rs-item-price.free{color:var(--green)}
.rs-item-price.cost-admin{color:var(--p600)}
.rs-item-price.cost-sup{color:var(--amber)}
.rs-item-price.cost-vend{color:var(--blue)}
.rs-item-desc{font-size:12px;color:var(--g400);line-height:1.5}
.rs-counts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.rs-count-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.rsc-admin{background:rgba(107,33,168,.1);color:var(--p600)}
.rsc-sup{background:rgba(22,163,74,.1);color:var(--green)}
.rsc-vend{background:var(--blue-bg);color:var(--blue)}

/* COMPENSACIÓN */
.comp-box{background:var(--white);border:1.5px solid var(--p300);border-radius:var(--r-sm);padding:14px 18px;box-shadow:var(--sh)}
.comp-box-title{font-size:12px;font-weight:700;color:var(--p600);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.comp-item{text-align:center;padding:10px 6px;background:var(--g50);border-radius:var(--r-sm);border:1px solid var(--g100)}
.comp-item .ci-val{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:800;color:var(--g800)}
.comp-item .ci-val.pos{color:var(--green)}
.comp-item .ci-val.neg{color:var(--red)}
.comp-item .ci-lbl{font-size:10px;color:var(--g600);margin-top:3px;line-height:1.4;font-weight:500}

/* TARIFAS ADICIONALES */
.tarifas-add{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.ta-head{background:linear-gradient(135deg,var(--p800) 0%,var(--p600) 100%);padding:16px 22px;display:flex;align-items:center;gap:12px}
.ta-head-icon{font-size:22px}
.ta-head-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--white)}
.ta-head-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
.ta-body{padding:20px 22px;display:flex;flex-direction:column;gap:20px}
.ta-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--g400);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ta-section-title::after{content:'';flex:1;height:1px;background:var(--g100)}

/* Tarjetas de usuario */
.ta-roles-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ta-role-card{border:1.5px solid var(--g200);border-radius:var(--r-sm);padding:14px 16px;position:relative;overflow:hidden}
.ta-role-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.ta-role-card.admin::before{background:var(--p500)}
.ta-role-card.sup::before{background:var(--green)}
.ta-role-card.vend::before{background:var(--blue)}
.ta-role-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ta-role-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ta-role-ico.admin{background:rgba(107,33,168,.1)}
.ta-role-ico.sup{background:rgba(22,163,74,.1)}
.ta-role-ico.vend{background:var(--blue-bg)}
.ta-role-name{font-weight:700;font-size:13px;color:var(--g800)}
.ta-role-access{font-size:11px;color:var(--g400);margin-top:1px}
.ta-role-price{display:flex;align-items:baseline;gap:4px;margin-top:8px}
.ta-role-price .price-num{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800}
.ta-role-price .price-num.admin{color:var(--p600)}
.ta-role-price .price-num.sup{color:var(--green)}
.ta-role-price .price-num.vend{color:var(--blue)}
.ta-role-price .price-unit{font-size:12px;color:var(--g400);font-weight:500}
.ta-role-base{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:6px;background:var(--green-bg);color:var(--green)}

/* Tabla de rangos DTE */
.ta-dte-table{width:100%;border-collapse:collapse;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--g200)}
.ta-dte-table th{background:var(--g100);padding:9px 14px;font-size:11px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.6px;text-align:left}
.ta-dte-table th:last-child{text-align:right}
.ta-dte-table td{padding:9px 14px;font-size:13px;color:var(--g600);border-top:1px solid var(--g100)}
.ta-dte-table td:last-child{text-align:right;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--g800)}
.ta-dte-table tr.free-dte td{color:var(--green);font-weight:600}
.ta-dte-table tr.active-dte{background:rgba(147,51,234,.05)}
.ta-dte-table tr.active-dte td{color:var(--p600);font-weight:700}
.active-tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;background:rgba(147,51,234,.1);color:var(--p600);margin-left:6px}

/* Sucursal adicional */
.ta-suc-card{border:1.5px solid var(--g200);border-radius:var(--r-sm);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ta-suc-left{display:flex;align-items:center;gap:12px}
.ta-suc-icon{width:42px;height:42px;border-radius:10px;background:var(--p100);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ta-suc-title{font-weight:700;font-size:14px;color:var(--g800)}
.ta-suc-desc{font-size:12px;color:var(--g400);margin-top:2px;line-height:1.4}
.ta-suc-price{text-align:right}
.ta-suc-price .sp-num{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:800;color:var(--p600)}
.ta-suc-price .sp-unit{font-size:12px;color:var(--g400)}

/* Nota pie */
.ta-footnote{font-size:11px;color:var(--g400);line-height:1.6;padding:12px 14px;background:var(--g50);border-radius:var(--r-sm);border:1px solid var(--g100)}
.ta-footnote strong{color:var(--g600)}

/* CTAs */
.cta-wrap{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.btn-cta-gold{background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);color:var(--p900);font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:15px;padding:12px 30px;border-radius:40px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(245,197,24,.4);transition:all .15s}
.btn-cta-gold:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,197,24,.5)}
.btn-pdf{background:linear-gradient(135deg,var(--p600) 0%,var(--p500) 100%);color:var(--white);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;padding:12px 26px;border-radius:40px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(107,33,168,.4);transition:all .15s}
.btn-pdf:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(107,33,168,.5)}
.btn-pdf:disabled{opacity:.6;cursor:default;transform:none}
.btn-restart{background:transparent;border:1.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.6);border-radius:40px;padding:10px 22px;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.btn-restart:hover{border-color:rgba(255,255,255,.6);color:var(--white)}
.btn-print-r{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:rgba(255,255,255,.65);border-radius:40px;padding:8px 18px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.btn-print-r:hover{color:var(--white);border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.08)}
.btn-edit-r{background:transparent;border:1.5px solid var(--gold);color:var(--gold);border-radius:40px;padding:8px 18px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;transition:all .15s}
.btn-edit-r:hover{background:var(--gold);color:var(--p900)}
.note-small{font-size:11px;color:rgba(255,255,255,.35);text-align:center;margin-top:8px}

/* Barra de acciones fija (sticky) en el Paso 6 */
.sticky-actions{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(19,3,38,.96);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:1px solid rgba(255,255,255,.12)}
#step-6 .result-wrap{padding-bottom:150px}
.sticky-actions .cta-wrap{margin-top:0;padding:12px 16px}
.opp-status{display:none;font-size:13px;font-weight:700;text-align:center;padding:9px 14px}
.opp-status.show{display:block;background:rgba(255,255,255,.12);color:#fff}
.opp-status.ok{background:var(--green);color:#fff}
.opp-status.edit{background:var(--gold);color:var(--p900)}
.opp-status.err{background:var(--red);color:#fff}
.hidden{display:none !important}
@media(max-width:480px){.card-head,.card-body,.card-nav{padding-left:16px;padding-right:16px}}
@media print{body{background:white;padding:0}.result-hero{background:#3b0764;-webkit-print-color-adjust:exact;print-color-adjust:exact}.cta-wrap,.btn-print-r,.progress-wrap{display:none !important}}
</style>
</head>
<body>

<div class=&quot;header&quot;>
  <div class=&quot;logos&quot;>
    <div class=&quot;logo-crece&quot;>CRECE<sup>+</sup></div>
  </div>
  <h1>Cotizador <em>Punto de Venta</em></h1>
  <p>Chile · Perú · Colombia — propuesta exacta para tu cliente</p>
</div>

<div class=&quot;wrapper&quot;>
  <div class=&quot;progress-wrap&quot;><div class=&quot;progress-steps&quot; id=&quot;progress-steps&quot;></div></div>

  <!-- PASO 1: PAÍS -->
  <div class=&quot;card&quot; id=&quot;step-1&quot;>
    <div class=&quot;card-head&quot;>
      <div class=&quot;step-label&quot;>Paso 1</div>
      <h2>¿En qué país opera el cliente?</h2>
      <p>Define la moneda, el impuesto y las tasas de conversión</p>
    </div>
    <div class=&quot;card-body&quot; style=&quot;display:flex;flex-direction:column;gap:18px&quot;>
      <div class=&quot;pais-grid&quot;>
        <div class=&quot;pais-opt&quot; id=&quot;popt-cl&quot; onclick=&quot;selectPais('cl')&quot;><span class=&quot;pais-flag&quot;>🇨🇱</span><div class=&quot;pais-name&quot;>Chile</div><div class=&quot;pais-moneda&quot;>Peso chileno (CLP)</div><div class=&quot;pais-tax&quot;>IVA 19%</div></div>
        <div class=&quot;pais-opt&quot; id=&quot;popt-pe&quot; onclick=&quot;selectPais('pe')&quot;><span class=&quot;pais-flag&quot;>🇵🇪</span><div class=&quot;pais-name&quot;>Perú</div><div class=&quot;pais-moneda&quot;>Sol peruano (PEN)</div><div class=&quot;pais-tax&quot;>IGV 18%</div></div>
        <div class=&quot;pais-opt&quot; id=&quot;popt-co&quot; onclick=&quot;selectPais('co')&quot;><span class=&quot;pais-flag&quot;>🇨🇴</span><div class=&quot;pais-name&quot;>Colombia</div><div class=&quot;pais-moneda&quot;>Peso colombiano (COP)</div><div class=&quot;pais-tax&quot;>IVA 19%</div></div>
      </div>
      <div class=&quot;tasas-wrap&quot;>
        <div class=&quot;tasas-title&quot;>💱 Tasas de conversión (editables)</div>
        <div class=&quot;tasas-grid&quot; id=&quot;tasas-grid&quot;></div>
      </div>
    </div>
    <div class=&quot;card-nav&quot;><span></span><button class=&quot;btn-next&quot; id=&quot;btn-next-1&quot; onclick=&quot;goStep(2)&quot; disabled>Continuar →</button></div>
  </div>

  <!-- PASO 2: CLIENTE -->
  <div class=&quot;card hidden&quot; id=&quot;step-2&quot;>
    <div class=&quot;card-head&quot;>
      <div class=&quot;step-label&quot;>Paso 2</div>
      <div class=&quot;paso-pais&quot; id=&quot;paso-pais-2&quot;></div>
      <h2>Datos del cliente</h2>
      <p>Nombre y cantidad de empresas o razones sociales</p>
    </div>
    <div class=&quot;card-body&quot;>
      <div class=&quot;field-group&quot;>
        <div class=&quot;field&quot; style=&quot;grid-column:1/-1&quot;>
          <label>Nombre comercial del cliente</label>
          <input id=&quot;cliente-nombre&quot; type=&quot;text&quot; class=&quot;txt-input&quot; placeholder=&quot;Ej: Importadora SCG SpA&quot; oninput=&quot;checkStep2()&quot;>
        </div>
        <div class=&quot;field&quot;>
          <label id=&quot;lbl-doc&quot;>Documento tributario</label>
          <div class=&quot;sub&quot; id=&quot;sub-doc&quot;>RUT / RUC / NIT según país</div>
          <input id=&quot;cli-documento&quot; type=&quot;text&quot; class=&quot;txt-input&quot; placeholder=&quot;Ej: 76.123.456-7&quot; oninput=&quot;S.documento=this.value&quot;>
        </div>
        <div class=&quot;field&quot;>
          <label>Razón social</label>
          <div class=&quot;sub&quot;>Nombre legal de la empresa</div>
          <input id=&quot;cli-razon&quot; type=&quot;text&quot; class=&quot;txt-input&quot; placeholder=&quot;Ej: Importadora SCG SpA&quot; oninput=&quot;S.razonSocial=this.value&quot;>
        </div>
        <div class=&quot;field&quot;>
          <label>Representante legal</label>
          <div class=&quot;sub&quot;>Nombre de quien firma</div>
          <input id=&quot;cli-repre&quot; type=&quot;text&quot; class=&quot;txt-input&quot; placeholder=&quot;Ej: Juan Pérez&quot; oninput=&quot;S.repreNombre=this.value&quot;>
        </div>
        <div class=&quot;field&quot;>
          <label>Documento del representante</label>
          <div class=&quot;sub&quot;>Cédula / DNI del representante</div>
          <input id=&quot;cli-repre-doc&quot; type=&quot;text&quot; class=&quot;txt-input&quot; placeholder=&quot;Ej: 12.345.678-9&quot; oninput=&quot;S.repreDoc=this.value&quot;>
        </div>
        <div class=&quot;field&quot;>
          <label>Empresas / razones sociales</label>
          <div class=&quot;sub&quot;>¿Cuántas empresas distintas?</div>
          <div class=&quot;stepper&quot;>
            <button onclick=&quot;change('empresas',-1)&quot; id=&quot;btn-emp-minus&quot; disabled>−</button>
            <div class=&quot;num&quot; id=&quot;val-empresas&quot;>1</div>
            <button onclick=&quot;change('empresas',1)&quot;>+</button>
          </div>
        </div>
      </div>
      <div class=&quot;sub&quot; style=&quot;margin-top:14px;color:var(--g400)&quot;>Los datos tributarios y del representante son opcionales para cotizar, pero necesarios para guardar la oportunidad en el pipeline.</div>
    </div>
    <div class=&quot;card-nav&quot;>
      <button class=&quot;btn-back&quot; onclick=&quot;goStep(1)&quot;>← Volver</button>
      <button class=&quot;btn-next&quot; id=&quot;btn-next-2&quot; onclick=&quot;goStep(3)&quot; disabled>Continuar →</button>
    </div>
  </div>

  <!-- PASO 3: SUCURSALES -->
  <div class=&quot;card hidden&quot; id=&quot;step-3&quot;>
    <div class=&quot;card-head&quot;>
      <div class=&quot;step-label&quot;>Paso 3</div>
      <div class=&quot;paso-pais&quot; id=&quot;paso-pais-3&quot;></div>
      <h2>Sucursales por empresa</h2>
      <p>¿Cuántas sucursales o locales tiene cada empresa?</p>
    </div>
    <div class=&quot;card-body&quot;><div class=&quot;sucursales-grid&quot; id=&quot;empresas-grid&quot;></div></div>
    <div class=&quot;card-nav&quot;>
      <button class=&quot;btn-back&quot; onclick=&quot;goStep(2)&quot;>← Volver</button>
      <button class=&quot;btn-next&quot; onclick=&quot;goStep(4)&quot;>Continuar →</button>
    </div>
  </div>

  <!-- PASO 4: USUARIOS -->
  <div class=&quot;card hidden&quot; id=&quot;step-4&quot;>
    <div class=&quot;card-head&quot;>
      <div class=&quot;step-label&quot;>Paso 4</div>
      <div class=&quot;paso-pais&quot; id=&quot;paso-pais-4&quot;></div>
      <h2>Usuarios de la operación</h2>
      <p>
        Indica los <strong>totales</strong>. Por defecto cada empresa incluye <strong>1 Administrador gratis</strong> y cada sucursal <strong>1 Supervisor gratis</strong>; los <strong>Vendedores</strong> vienen incluidos según el plan.<br>
        <span style=&quot;font-size:12px;color:var(--g400);margin-top:4px;display:block&quot;>Adicionales: Admin +0,4 UF · Supervisor +0,5 UF · Vendedor +0,3 UF (tarifas Chile; varían por país)</span>
      </p>
    </div>
    <div class=&quot;card-body&quot;>
      <div class=&quot;field-group&quot;>
        <div class=&quot;field&quot;>

<script>
// ═══════════════════════════════════

// ═══════════════════════════════════
const ROLES = {

    desc:'Vende en caja · Inventario · Promociones · Reportes de sucursal',
    ufBase:0,       // 1 por sucursal: gratis
    ufExtra:0.5,    // adicionales
    priceCssClass:'cost-sup', priceBadgeClass:'cost-sup',
    scope:'sucursal',
  },
  vend: {
    key:'vend', nombre:'Vendedor', icon:'🖥️', iconClass:'vend',
    desc:'Módulo venta · Proformas · Apertura y cierre de caja',
    ufBase:null,    // incluidos en plan (compensación entre sucursales)
    ufExtra:0.3,    // los que exceden el pool del plan
    priceCssClass:'cost-vend', priceBadgeClass:'cost-vend',
    scope:'plan',
  },
};

// ═══════════════════════════════════
//  PAÍSES
// ═══════════════════════════════════
const PAISES = {
  cl:{ nombre:'Chile',flag:'🇨🇱',moneda:'CLP',impuesto:0.19,impuestoNombre:'IVA 19%',
    tasas:[{id:'uf_clp',label:'UF → CLP',defaultVal:41074,desc:'CLP por 1 UF'}],
    convertir(uf,t){const v=uf*t.uf_clp;return{principal:fmtN(v,'$',0,'CLP'),secundario:null}},
    mostrarUF:true },
  pe:{ nombre:'Perú',flag:'🇵🇪',moneda:'PEN',impuesto:0.18,impuestoNombre:'IGV 18%',
    tasas:[{id:'uf_usd',label:'UF → USD',defaultVal:41.75,desc:'USD por 1 UF'},{id:'usd_pen',label:'USD → S/',defaultVal:3.45,desc:'Soles por 1 USD'}],
    convertir(uf,t){const usd=uf*t.uf_usd;const pen=usd*t.usd_pen;return{principal:fmtN(pen,'S/',2,'PEN'),secundario:fmtN(usd,'USD ',2,'USD')}},
    mostrarUF:false },
  co:{ nombre:'Colombia',flag:'🇨🇴',moneda:'COP',impuesto:0.19,impuestoNombre:'IVA 19%',
    tasas:[{id:'uf_usd',label:'UF → USD',defaultVal:41.75,desc:'USD por 1 UF'},{id:'usd_cop',label:'USD → COP',defaultVal:3308,desc:'COP por 1 USD'}],
    convertir(uf,t){const usd=uf*t.uf_usd;const cop=usd*t.usd_cop;return{principal:fmtN(cop,'$',0,'COP'),secundario:fmtN(usd,'USD ',2,'USD')}},
    mostrarUF:false },
};
const TASAS={uf_clp:41074,uf_usd:41.75,usd_pen:3.45,usd_cop:3308};
function fmtN(val,pre,dec,suf){return{val,str:pre+val.toLocaleString('es-CL',{minimumFractionDigits:dec,maximumFractionDigits:dec})+(suf&amp;&amp;dec===0?' '+suf:'')};}

// ═══════════════════════════════════
//  PLANES
// ═══════════════════════════════════
const PLANES={
  basic:{nombre:'Plan Basic',uf:0.6,cajas:1,sku:1000,boletas:200,icon:'⚡'},
  plus: {nombre:'Plan Plus', uf:1.0,cajas:2,sku:2000,boletas:500, icon:'🚀'},
  max:  {nombre:'Plan Max',  uf:1.5,cajas:3,sku:5000,boletas:1000,icon:'💎'},
};

// ═══════════════════════════════════
//  DOCUMENTOS ELECTRÓNICOS (facturas/DTE) INCLUIDOS · por país y plan
//  Actualizado Ago 2026 según benchmark de mercado. Infinity = ilimitado (fair-use).
//  Chile mantiene boletas aparte; aquí solo se cuentan facturas/DTE.
// ═══════════════════════════════════
const DTE_INCLUIDOS={
  cl:{ basic:1000, plus:3000, max:Infinity },
  pe:{ basic:800,  plus:2000, max:Infinity },
  co:{ basic:1000, plus:3000, max:Infinity },
};
// Fair-use del &quot;ilimitado&quot; (plan Max): por sucursal, con pool a nivel empresa.
const DTE_FAIRUSE_POR_SUC=10000;
// Excedente de documentos electrónicos: bloque de 500 documentos adicionales a X UF por país.
const DTE_BLOQUE={ docs:500, uf:{ cl:0.5, pe:0.5, co:0.5 } };
function dteBloqueUF(paisKey){ return DTE_BLOQUE.uf[paisKey] ?? DTE_BLOQUE.uf.cl; }

// Precio en UF por país y plan (Sep 2026). Chile sostiene tarifas más altas que PE/CO.
// Perú Plus/Max ajustados a S/145 y S/195 (UF = soles / 156,24 a tasa base).
const PLAN_UF={
  cl:{ basic:0.9,      plus:1.5,      max:2.0      },
  pe:{ basic:0.6,      plus:0.928059, max:1.248079 },  // ≈ S/94 / S/145 / S/195
  co:{ basic:0.6,      plus:1.0,      max:1.5      },
};
function planUF(paisKey,planKey){return (PLAN_UF[paisKey]||PLAN_UF.cl)[planKey] ?? PLANES[planKey].uf;}

// Cajas (vendedores) incluidas por país y plan. Perú sube (Plus 3 / Max 5) para que
// el cobro por usuario no juegue en contra frente a competidores con usuarios ilimitados.
const CAJAS_INCLUIDAS={ pe:{ basic:1, plus:3, max:5 } };
function cajasIncl(paisKey,planKey){return (CAJAS_INCLUIDAS[paisKey]||{})[planKey] ?? PLANES[planKey].cajas;}

// Adicionales (roles) en UF por país — alineados a mercado local (Ago 2026).
const ROLES_UF={
  cl:{ admin:0.40, sup:0.50, vend:0.30 },
  pe:{ admin:0.19, sup:0.30, vend:0.30 },
  co:{ admin:0.19, sup:0.25, vend:0.25 },
};
function roleUF(paisKey,role){return (ROLES_UF[paisKey]||ROLES_UF.cl)[role] ?? PLANES.basic.uf;}

// SKU incluidos por país/plan (Colombia sube fuerte: el mercado da SKU ilimitado).
const SKU_INCLUIDOS={ co:{ basic:10000, plus:50000, max:Infinity } };
function skuIncl(paisKey,planKey){return (SKU_INCLUIDOS[paisKey]||{})[planKey] ?? PLANES[planKey].sku;}
// Bloque de SKU adicional en UF por país (Chile/Perú 0,47/5.000; Colombia 0,17/5.000).
const SKU_BLOQUE_UF={ cl:0.47, pe:0.47, co:0.17 };
function skuBloqueUF(paisKey){return SKU_BLOQUE_UF[paisKey] ?? 0.47;}

// ═══════════════════════════════════
//  ESTADO
// ═══════════════════════════════════
const S={
  step:1, pais:null, clienteNombre:'', empresas:1,
  sucursalesPorEmpresa:[1],
  // usuarios[e][s] = { vend, adminExtra, supExtra }
  // vend = usuarios vendedor (operativos del plan, compensados entre sucursales)
  // adminExtra = admins adicionales (cobrados, además del 1 gratis por empresa)
  // supExtra   = supervisores adicionales (cobrados, además del 1 gratis por sucursal)
  usuarios:[],
  sku:500, boletas:100, facturas:0,
  // Descuento comercial (opcional): se habilita en el Paso 5 y se aplica sobre el neto
  descuentoHabilitado:false, descuentoTipo:'pct', descuentoValor:0,
  // ── Datos del cliente (para registrar la oportunidad) ──
  documento:'', razonSocial:'', repreNombre:'', repreDoc:'',

function goStep(n){
  if(n===3) buildEmpresasGrid();
  if(n===4) renderUsuariosResumen();
  if(n===6) renderResultado();
  document.getElementById('step-'+S.step)?.classList.add('hidden');
  document.getElementById('step-'+n)?.classList.remove('hidden');
  S.step=n;
  renderProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── Descuento comercial ──
function toggleDescuento(cb){
  S.descuentoHabilitado=cb.checked;
  if(!cb.checked){ S.descuentoValor=0; const dv=document.getElementById('desc-valor'); if(dv) dv.value=''; }
  if(S.step===6) renderResultado();
}
function setDescuentoTipo(t){
  S.descuentoTipo=t;
  renderResultado();
}
function setDescuentoValor(v){
  let n=parseFloat(String(v).replace(',','.')); if(isNaN(n)||n<0) n=0;
  if(S.descuentoTipo==='pct') n=Math.min(100,n);
  S.descuentoValor=n;
  renderResultado();
}

// ── Condiciones comerciales ──
function setModalidad(m){
  S.modalidad=m;
  const fm=document.getElementById('field-meses');
  const inp=document.getElementById('cond-meses');
  const sub=document.getElementById('sub-meses');
  if(m==='mensual'){
    if(fm) fm.style.display='none';

  } else {
    if(fm) fm.style.display='';
    const def = m==='anual'?12:6;
    S.mesesCobrados=def;
    if(inp){ inp.max = m==='anual'?12:6; inp.value=def; }
    if(sub) sub.textContent = m==='anual'
      ? 'Meses facturados (promo: 12 → cobra 10 u 11)'
      : 'Meses facturados (promo: 6 → cobra 5)';
  }
}
function updImplMonedaLabel(){

function renderProgress(){
  const wrap=document.getElementById('progress-steps');
  wrap.innerHTML='';
  STEPS.forEach((st,i)=>{
    const node=document.createElement('div');
    const clicable = st.id===1 || !!S.pais;   // se puede saltar una vez elegido el país
    node.className='step-node'+(S.step===st.id?' active':S.step>st.id?' done':'');
    if(clicable){ node.style.cursor='pointer'; node.title='Ir al paso '+st.id+' · '+st.label; node.onclick=()=>irAStep(st.id); }
    node.innerHTML=`<div class=&quot;dot&quot;>${S.step>st.id?'✓':st.id}</div><div class=&quot;lbl&quot;>${st.label}</div>`;
    wrap.appendChild(node);
    if(i<STEPS.length-1){
      const line=document.createElement('div');
      line.className='step-line'+(S.step>st.id?' done':'');
      wrap.appendChild(line);
    }
  });
}
// Permite saltar a cualquier paso (útil al editar una oportunidad). Requiere país elegido para pasos 2+.
function irAStep(n){
  if(n===S.step) return;
  if(n>1 &amp;&amp; !S.pais){ return; }
  goStep(n);
}

const LIMITS={empresas:{min:1,max:50},sku:{min:0,max:200000},boletas:{min:0,max:10000},facturas:{min:0,max:20000}};
// Mínimo del plan de entrada (Basic) por país — usado como valor por defecto y placeholder
function volMin(field){
  const c=S.pais||'cl';
  if(field==='sku') return skuIncl(c,'basic');
  if(field==='facturas') return dteIncluidos(c,'basic');
  return 0;
}
function change(field,delta){
  const lim=LIMITS[field]; if(!lim) return;
  const cur=field==='empresas'?S.empresas:(S[field]!=null?S[field]:volMin(field));
  const next=Math.max(lim.min,Math.min(lim.max,cur+delta));
  if(field==='empresas'){
    S.empresas=next;
    while(S.sucursalesPorEmpresa.length<next) S.sucursalesPorEmpresa.push(1);
    S.sucursalesPorEmpresa.length=next;
    document.getElementById('btn-emp-minus').disabled=(next<=1);
  } else { S[field]=next; }
  writeVol(field,next);
}
// Escribe el valor en el display (soporta <div> y <input>)
function writeVol(field,v){
  const el=document.getElementById('val-'+field);
  if(!el) return;
  if(el.tagName==='INPUT') el.value=v; else el.textContent=v.toLocaleString('es-CL');
}
// Entrada directa por teclado (clamp a LIMITS)
function setVal(field,raw){
  const lim=LIMITS[field]; if(!lim) return;
  const s=String(raw).replace(/[^\d]/g,'');
  if(s===''){ S[field]=volMin(field); return; }   // vacío = mínimo del plan (placeholder)
  let v=parseInt(s,10); if(isNaN(v)) v=volMin(field);
  v=Math.max(lim.min,Math.min(lim.max,v));
  S[field]=v;
  // no reescribimos el input mientras el usuario escribe; solo guardamos el estado
}

  document.getElementById('ssub-'+e).textContent=next+' sucursal'+(next>1?'es':'');
  document.getElementById('sminus-'+e).disabled=(next<=1);

function setSuc(e,raw){
  let v=parseInt(String(raw).replace(/[^\d]/g,''),10); if(isNaN(v)||v<1) v=1;

  const mb=document.getElementById('sminus-'+e); if(mb) mb.disabled=(v<=1);
}

function changeUsr(e,s,field,d){
  const minVal=field==='vend'?1:0;
  const cur=S.usuarios[e][s][field];

  S.usuarios[e][s][field]=next;
  const idMap={vend:`vval-${e}-${s}`,adminExtra:`aval-${e}-${s}`,supExtra:`sval2-${e}-${s}`};
  const minMap={vend:`vminus-${e}-${s}`,adminExtra:`aminus-${e}-${s}`,supExtra:`sminus2-${e}-${s}`};
  document.getElementById(idMap[field]).textContent=next;
  document.getElementById(minMap[field]).disabled=(next<=minVal);
}

function totalSucursalesCalc(){ return S.sucursalesPorEmpresa.slice(0,S.empresas).reduce((a,n)=>a+(parseInt(n)||0),0); }

// Distribuye los totales (vendedores, admins, supervisores) en usuarios[e][s] para el motor de cálculo.
function aplicarUsuariosAgregados(){
  const totSuc=totalSucursalesCalc()||1;
  const vTot=Math.max(0,parseInt(S.vendsTotal)||0);
  const aReq=Math.max(0,parseInt(S.adminsReq)||0);
  const sReq=Math.max(0,parseInt(S.supsReq)||0);
  const adminExtraTot=Math.max(0,aReq-S.empresas);     // 1 admin gratis por empresa
  const supExtraTot=Math.max(0,sReq-totSuc);            // 1 supervisor gratis por sucursal
  const base=Math.floor(vTot/totSuc), rem=vTot%totSuc;  // vendedores lo más parejo posible por sucursal
  let idx=0;
  S.usuarios=S.sucursalesPorEmpresa.slice(0,S.empresas).map(numSuc=>Array.from({length:numSuc},()=>{
    const v=base+(idx<rem?1:0); idx++;
    return { vend:v, adminExtra:0, supExtra:0 };
  }));
  if(S.usuarios[0] &amp;&amp; S.usuarios[0][0]){ S.usuarios[0][0].adminExtra=adminExtraTot; S.usuarios[0][0].supExtra=supExtraTot; }
}

function renderUsuariosResumen(){
  const totSuc=totalSucursalesCalc()||1;
  if(S.adminsReq==null || S.supsReq==null || S.vendsTotal==null){
    if(S.usuarios &amp;&amp; S.usuarios.length){   // retrocompat: derivar totales de un detalle previo

      S.adminsReq=S.empresas+ad; S.supsReq=totSuc+su; S.vendsTotal=ve;
    } else {
      S.adminsReq=S.empresas; S.supsReq=totSuc; S.vendsTotal=totSuc;   // 1 vendedor/sucursal por defecto
    }

  const setv=(id,v)=>{const e=document.getElementById(id); if(e) e.value=v;};

// ═══════════════════════════════════
//  LÓGICA COTIZACIÓN
// ═══════════════════════════════════
function dteIncluidos(paisKey,planKey){
  return (DTE_INCLUIDOS[paisKey]||DTE_INCLUIDOS.cl)[planKey] ?? 50;
}
function calcFacturacionExtra(dte,planKey,paisKey){
  const inc=dteIncluidos(paisKey,planKey);
  if(inc===Infinity) return 0;            // ilimitado (fair-use): sin cargo por rango
  const ex=Math.max(0,dte-inc);
  if(ex<=0) return 0;
  // Bloques de 500 documentos adicionales (o fracción) a la tarifa del país.
  return Math.ceil(ex/DTE_BLOQUE.docs)*dteBloqueUF(paisKey);
}
function recommendPlan(maxVend,sku,facturas,paisKey){
  // Ventas y recibos ilimitados: el plan se decide por usuarios/caja, SKU y documentos electrónicos (DTE).
  if(maxVend<=cajasIncl(paisKey,'basic')&amp;&amp;sku<=skuIncl(paisKey,'basic')&amp;&amp;facturas<=dteIncluidos(paisKey,'basic')) return 'basic';
  if(maxVend<=cajasIncl(paisKey,'plus')&amp;&amp;sku<=skuIncl(paisKey,'plus')&amp;&amp;facturas<=dteIncluidos(paisKey,'plus')) return 'plus';
  return 'max';
}
function leerTasas(){
  if(!S.pais) return;
  PAISES[S.pais].tasas.forEach(t=>{
    const el=document.getElementById('tasa-res-'+t.id)||document.getElementById('tasa-'+t.id);
    if(el) TASAS[t.id]=parseFloat(el.value)||TASAS[t.id];
  });
}

function calcCotizacion(){
  leerTasas();
  const pais=PAISES[S.pais];

  // Aplanar sucursales
  const flat=[];
  for(let e=0;e<S.empresas;e++){
    for(let s=0;s<S.sucursalesPorEmpresa[e];s++){
      const u=S.usuarios[e]?.[s]??{vend:1,adminExtra:0,supExtra:0};
      flat.push({
        empresa:e, sucursal:s,
        label:S.empresas>1?`Emp.${e+1}·Suc.${s+1}`:`Sucursal ${s+1}`,
        isFirst:s===0,
        vend:u.vend, adminExtra:u.adminExtra, supExtra:u.supExtra,
      });
    }
  }

  const totalSucursales=flat.length;
  const maxVend=Math.max(...flat.map(f=>f.vend));
  const planKey=recommendPlan(maxVend,S.sku,S.facturas,S.pais);
  const plan=PLANES[planKey];

  // ── VENDEDORES: compensación entre sucursales ──
  const cajasBase=cajasIncl(S.pais,planKey);
  const totalSlotsVend=cajasBase*totalSucursales;
  const totalVendReq=flat.reduce((a,f)=>a+f.vend,0);
  const vendExtra=Math.max(0,totalVendReq-totalSlotsVend);

  // ── ADMINS EXTRA: suma de adminExtra en todas las sucursales ──
  const totalAdminExtra=flat.reduce((a,f)=>a+f.adminExtra,0);

  // ── SUPERVISORES EXTRA ──
  const totalSupExtra=flat.reduce((a,f)=>a+f.supExtra,0);

  // ── TOTALES GRATIS ──
  const totalAdminsBase=S.empresas;       // 1 gratis por empresa
  const totalSupsBase=totalSucursales;    // 1 gratis por sucursal

  // ── COSTOS UF ──
  const ufBase         = planUF(S.pais,planKey);
  const ufPlan         = ufBase*totalSucursales;
  const ufVendExtra    = vendExtra*roleUF(S.pais,'vend');
  const ufAdminExtra   = totalAdminExtra*roleUF(S.pais,'admin');
  const ufSupExtra     = totalSupExtra*roleUF(S.pais,'sup');
  const ufFacturacion  = calcFacturacionExtra(S.facturas,planKey,S.pais)*totalSucursales;
  const ufNeto         = ufPlan+ufVendExtra+ufAdminExtra+ufSupExtra+ufFacturacion;

  // Conversión
  const conv=(uf)=>pais.convertir(uf,TASAS);

  // ── Descuento comercial (sobre el neto) ──
  let descuentoUF=0;
  if(S.descuentoHabilitado &amp;&amp; S.descuentoValor>0){
    if(S.descuentoTipo==='pct'){
      descuentoUF = ufNeto*(Math.min(100,S.descuentoValor)/100);
    } else { // monto fijo en moneda local → a UF
      const factor = pais.convertir(1,TASAS).principal.val; // 1 UF = factor moneda local
      descuentoUF = factor>0 ? S.descuentoValor/factor : 0;
    }
    descuentoUF = Math.max(0, Math.min(ufNeto, descuentoUF));
  }
  const ufNetoConDesc  = ufNeto-descuentoUF;
  const ufIva          = ufNetoConDesc*pais.impuesto;
  const ufConIva       = ufNetoConDesc*(1+pais.impuesto);

  // Detalle por sucursal para tabla
  const detalle=flat.map(f=>({
    ...f,
    slotsVend:cajasBase,
    balanceVend:f.vend-cajasBase,
  }));

  const totalLibres=detalle.reduce((a,f)=>a+Math.max(0,-f.balanceVend),0);
  const totalExceden=detalle.reduce((a,f)=>a+Math.max(0,f.balanceVend),0);
  const vendCompensados=Math.min(totalLibres,totalExceden);

  return {
    planKey,plan,pais,
    totalSucursales,totalAdminsBase,totalSupsBase,
    totalAdminExtra,totalSupExtra,vendExtra,vendCompensados,
    totalSlotsVend,totalVendReq,
    detalle,
    ufBase,cajasBase,ufPlan,ufVendExtra,ufAdminExtra,ufSupExtra,ufFacturacion,ufNeto,descuentoUF,ufNetoConDesc,ufIva,ufConIva,
    conv,
  };
}

    statusEl.textContent = '📸 Capturando contenido...';

    const canvas = await html2canvas(target, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#130326',
      scrollX: 0,
      scrollY: 0,
      windowWidth:  target.scrollWidth + 40,
      windowHeight: target.scrollHeight,
      logging: false,
    });

    statusEl.textContent = '📄 Construyendo PDF...';
    await new Promise(r => setTimeout(r, 100));

    const imgW = canvas.width;
    const imgH = canvas.height;

    const { jsPDF } = window.jspdf;
    const pdfW = 595.28;
    const pdfH = 841.89;
    const ratio   = pdfW / imgW;
    const scaledH = imgH * ratio;

    const pdf = new jsPDF({
      orientation: 'portrait',
      unit: 'pt',
      format: 'a4',
      compress: true,

// Factor moneda local por 1 UF (para pasar recurrente UF → unidad de captura del país)
function factorLocalCot(){ return PAISES[S.pais].convertir(1,TASAS).principal.val; }

// Construye la línea genérica que consume Comisiones + cachés de la oportunidad
function oportunidadLinea(C){
  const recurrenteUF = C.ufNetoConDesc;                 // recurrente mensual neto (post-descuento, pre-impuesto)
  const esUF = S.pais==='cl';
  const factor = factorLocalCot();
  const montoCaptura = esUF ? recurrenteUF : recurrenteUF*factor;   // monto en la unidad del país
  const implCaptura = parseFloat(S.implMonto)||0;                    // ya en unidad del país (UF en CL, local en PE/CO)
  const implUF = esUF ? implCaptura : (factor>0?implCaptura/factor:0);
  const meses = parseInt(S.mesesCobrados)||0;
  const linea = {
    id: S.oportunidadId ? ('opp_'+S.oportunidadId) : ('opp_'+Date.now()+'_'+Math.floor(Math.random()*1e4)),
    cliente: S.razonSocial||S.clienteNombre, pais:S.pais, plan:C.planKey, concepto:S.clienteNombre,
    monto: Math.round(montoCaptura*100)/100,
    sucM: S.modalidad==='mensual'?1:0,
    sucS: S.modalidad==='semestral'?1:0, mesesS: S.modalidad==='semestral'?meses:6,
    sucA: S.modalidad==='anual'?1:0, mesesA: S.modalidad==='anual'?meses:12,
    impl: implCaptura,
  };
  // venta base en UF + estimación de comisión (tramo medio 50% para mensual)
  let ventaUF, comEst;
  if(S.modalidad==='mensual'){ ventaUF=recurrenteUF+implUF; comEst=recurrenteUF*0.5+implUF*0.12; }
  else if(S.modalidad==='semestral'){ ventaUF=recurrenteUF*meses+implUF; comEst=recurrenteUF*meses*0.05+implUF*0.12; }
  else { ventaUF=recurrenteUF*meses+implUF; comEst=recurrenteUF*meses*0.10+implUF*0.12; }
  return { linea, recurrenteUF, ventaUF, comEst };
}

<title>Benchmark POS Crece+</title>
<link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;>
<link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin>
<link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=Space+Grotesk:wght@400;500;600;700;800&amp;display=swap&quot;>
<style>
  :root{
    /* Identidad dolpos × CRECE+ (violeta/dorado) */
    --p900:#130326; --p800:#1e0540; --p700:#3b0764; --p600:#6b21a8; --p500:#9333ea; --p400:#c084fc; --p300:#e9d5ff; --p100:#f5f0ff;
    --gold:#f5c518; --gold2:#fbbf24;
    --paper:#faf8ff; --card:#FFFFFF; --ink:#2d2045; --ink-soft:#5b4e7a;
    --line:#efeafb; --line-strong:#e5dff5;
    --teal:#6b21a8; --teal-soft:#f5f0ff; --teal-ink:#3b0764;   /* acento de marca CRECE+ (púrpura) */
    --pe:#9333ea; --co:#f5c518;
    --good:#16a34a; --mid:#d97706; --hot:#dc2626;
    --shadow:0 4px 24px rgba(107,33,168,.10),0 1px 2px rgba(107,33,168,.06);
    --mono:'Space Grotesk',system-ui,sans-serif;   /* dígitos monoespaciados por diseño */
    --sans:'Inter',system-ui,sans-serif;
    --disp:'Space Grotesk',var(--sans);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(160deg,var(--p900) 0%,var(--p800) 45%,#2e0652 100%);
    background-attachment:fixed;color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  h1,h2,h3{font-family:var(--disp);line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .eyebrow{font-family:var(--disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--p400);font-weight:600}

  /* header */
  header.hero{padding:34px 0 22px;text-align:center}
  .brandrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
  .logo-dolpos{font-family:var(--disp);font-weight:800;font-size:17px;color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 15px}
  .logo-crece{font-family:var(--disp);font-weight:800;font-size:17px;color:var(--p700);background:#fff;border-radius:10px;padding:6px 15px}
  .logo-crece sup{color:var(--gold2);font-size:11px}
  .brandrow .x{color:rgba(255,255,255,.3);font-size:20px}
  .hero .eyebrow{color:var(--gold);display:block;margin-bottom:6px}
  .hero h1{font-size:clamp(26px,4.6vw,44px);font-weight:800;color:#fff}
  .hero h1 em{font-style:normal;color:var(--gold)}
  .hero p.sub{color:rgba(255,255,255,.6);font-size:15px;margin:8px auto 0;max-width:62ch}
  .meta{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin-top:16px;font-size:12.5px;color:rgba(255,255,255,.5)}
  .meta b{color:rgba(255,255,255,.85);font-weight:600}

  /* control bar */
  .bar{position:sticky;top:0;z-index:20;background:rgba(19,3,38,.72);
    backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.10);padding:12px 0}
  .bar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:3px;gap:2px}
  .seg button{font-family:var(--sans);font-weight:600;font-size:14px;border:0;background:transparent;color:rgba(255,255,255,.65);
    padding:7px 15px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
  .seg button[aria-pressed=&quot;true&quot;]{background:var(--gold);color:var(--p900)}
  .seg button .dot{width:8px;height:8px;border-radius:50%}
  .flag{font-size:15px}
  .bar .note{margin-left:auto;font-size:12px;color:rgba(255,255,255,.55);font-family:var(--mono)}

  section{padding:34px 0}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .sec-head h2{font-size:clamp(20px,3vw,27px);font-weight:700;color:#fff}
  .sec-head p{color:rgba(255,255,255,.6);font-size:14px;max-width:52ch}

  /* competitor cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:12px}
  .card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .card h3{font-size:19px;font-weight:700}
  .card .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-ink);
    background:var(--teal-soft);padding:3px 8px;border-radius:6px;white-space:nowrap}
  .card .desc{font-size:13px;color:var(--ink-soft);margin-top:-4px}
  .ladder{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line);margin-top:2px}
  .rung{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
  .rung:last-child{border-bottom:0}
  .rung .pname{font-size:13.5px;font-weight:600}
  .rung .pmeta{font-size:11.5px;color:var(--ink-soft);grid-column:1;line-height:1.35}
  .rung .price{font-family:var(--mono);font-weight:600;font-size:15px;text-align:right;grid-row:1/3;align-self:center}
  .rung .delta{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);text-align:right}
  .rung.star .pname::after{content:&quot;★&quot;;color:var(--co);margin-left:5px;font-size:11px}
  .card .diff{font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
  .card .diff b{color:var(--ink);font-weight:600}
  /* CRECE+ highlighted card */
  .card.me{border:2px solid var(--teal);background:linear-gradient(180deg,var(--teal-soft),var(--card) 55%);
    grid-column:1/-1;box-shadow:0 2px 4px rgba(15,110,99,.12),0 14px 34px -16px rgba(15,110,99,.5)}
  .card.me h3{color:var(--teal-ink)}
  .card.me .tag{background:var(--teal);color:#fff}
  .card.me .ladder{border-top-color:color-mix(in srgb,var(--teal) 30%,transparent)}
  .card.me .rung{border-bottom-color:color-mix(in srgb,var(--teal) 18%,transparent)}
  .card.me .melist{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .card.me .mecol{border:1px solid color-mix(in srgb,var(--teal) 25%,transparent);border-radius:10px;padding:12px 14px;background:var(--card)}
  .card.me .mecol .pn{font-weight:700;font-size:14px;color:var(--teal-ink)}
  .card.me .mecol .pp{font-family:var(--mono);font-weight:600;font-size:20px;margin:4px 0 2px}
  .card.me .mecol .uf{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .card.me .mecol .cp{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.35}
  @media (max-width:640px){.card.me .melist{grid-template-columns:1fr}}
  .me-adic{border-top:1px solid color-mix(in srgb,var(--teal) 22%,transparent);margin-top:12px;padding-top:12px}
  .me-adic .ma-title{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-ink);margin-bottom:8px}
  .madic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
  .madic{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--card);
    border:1px solid color-mix(in srgb,var(--teal) 18%,transparent);border-radius:8px;padding:8px 11px}
  .madic .ma-k{font-size:12.5px;color:var(--ink)}
  .madic .ma-v{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--teal-ink);text-align:right}

  /* band strip */
  .bandbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;box-shadow:var(--shadow)}
  .strip{position:relative;height:300px;margin:8px 0 4px}
  .track{position:absolute;top:80px;left:0;right:0;height:6px;border-radius:4px;
    background:linear-gradient(90deg,var(--good),var(--mid) 55%,var(--hot))}
  /* competitor ticks hang BELOW the track, staggered into up to 5 rows */
  .tick{position:absolute;top:86px;transform:translateX(-50%);text-align:center;z-index:1}
  .tick .stem{width:2px;background:var(--line-strong);margin:0 auto}
  .tick .lab{font-family:var(--mono);font-size:10.5px;color:var(--ink);white-space:nowrap;margin-top:2px;font-weight:500}
  .tick .co{font-family:var(--mono);font-size:9.5px;font-weight:600;white-space:nowrap;line-height:1.2}
  /* CRECE+ ticks: teal with a filled dot on the track */
  .tick.me .stem{background:var(--teal);width:2.5px}
  .tick.me .lab{color:var(--teal-ink);font-weight:700}
  .tick.me .co{color:var(--teal);font-weight:700}
  .tick.me .mdot{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;
    background:var(--teal);border:2.5px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .tick[data-row=&quot;0&quot;] .stem{height:8px}
  .tick[data-row=&quot;1&quot;] .stem{height:30px}
  .tick[data-row=&quot;2&quot;] .stem{height:52px}
  .tick[data-row=&quot;3&quot;] .stem{height:74px}
  .tick[data-row=&quot;4&quot;] .stem{height:96px}
  /* Simulator marker sits ABOVE the track (ink, to differ from teal CRECE+ ticks) */
  .tick.you{top:0;z-index:6}
  .tick.you .col{display:flex;flex-direction:column;align-items:center}
  .tick.you .co{color:var(--ink);font-weight:700;font-size:12px;margin-bottom:3px;background:var(--paper);padding:1px 6px;border-radius:6px;border:1px solid var(--line-strong)}
  .tick.you .stem{height:64px;width:3px;background:var(--ink)}
  .tick.you .knob{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;
    background:var(--ink);border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .scale-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:4px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft)}
  .legend .lg{display:inline-flex;align-items:center;gap:7px}
  .lg-dot{width:11px;height:11px;border-radius:50%;flex:none}
  .lg-dot.me{background:var(--teal)}
  .lg-dot.comp{background:var(--line-strong)}
  .lg-dot.sim{background:var(--ink)}

  /* simulator */
  .sim{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:stretch}
  .sim .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:8px}
  .field .hint{font-weight:400;color:var(--ink-soft)}
  .inputrow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;padding:4px 14px}
  .inputrow span{font-family:var(--mono);color:var(--ink-soft);font-size:16px}
  .inputrow input[type=number]{flex:1;border:0;background:transparent;font-family:var(--mono);font-size:22px;font-weight:600;
    color:var(--ink);padding:10px 0;width:100%;outline:none}
  input[type=range]{width:100%;accent-color:var(--teal);margin-top:14px}
  .readout{display:flex;flex-direction:column;gap:16px;justify-content:center}
  .verdict{border-radius:12px;padding:16px 18px;border:1px solid var(--line)}
  .verdict .vlabel{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .verdict .vtitle{font-family:var(--disp);font-size:26px;font-weight:700;margin:2px 0 4px}
  .verdict .vtext{font-size:13.5px;color:var(--ink-soft)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
  .stat .v{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:3px}
  .pctbar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
  .pctbar i{display:block;height:100%;background:var(--teal);border-radius:5px}

  /* table */
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;min-width:640px}
  th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;white-space:nowrap}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
    cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
  th.sorted::after{content:&quot; ↓&quot;;color:var(--teal)}
  th.asc.sorted::after{content:&quot; ↑&quot;}
  td.pr{font-family:var(--mono);font-weight:600;text-align:right}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:color-mix(in srgb,var(--teal-soft) 40%,transparent)}
  .comp-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
  .b-good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
  .b-mid{background:color-mix(in srgb,var(--mid) 20%,transparent);color:var(--mid)}
  .b-hot{background:color-mix(in srgb,var(--hot) 18%,transparent);color:var(--hot)}
  .b-me{background:var(--teal);color:#fff}
  .b-nd{background:color-mix(in srgb,var(--ink-soft) 14%,transparent);color:var(--ink-soft)}
  tr.merow td{background:color-mix(in srgb,var(--teal-soft) 70%,transparent);border-top:1px solid var(--teal);border-bottom:1px solid var(--teal)}
  tr.merow:hover td{background:color-mix(in srgb,var(--teal-soft) 90%,transparent)}

  /* feature matrix */
  .matlegend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;color:rgba(255,255,255,.7)}
  .matlegend .mlg{display:inline-flex;align-items:center;gap:6px}
  .fc{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:12px;font-weight:700;font-family:var(--sans)}
  .fc.y{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
  .fc.p{background:color-mix(in srgb,var(--mid) 22%,transparent);color:var(--mid)}
  .fc.e{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal-ink)}
  .fc.r{background:transparent;color:var(--teal);border:1px dashed var(--teal)}
  .fc.c{background:color-mix(in srgb,var(--ink-soft) 12%,transparent);color:var(--ink-soft);font-size:12px}
  .fc.x{background:color-mix(in srgb,var(--ink-soft) 12%,transparent);color:var(--ink-soft)}
  .fc.n{background:transparent;color:var(--line-strong)}
  #mtbl{min-width:720px}
  #mtbl th,#mtbl td{text-align:center;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  #mtbl thead th{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink);position:sticky;top:0;background:var(--card);cursor:default}
  #mtbl thead th .cdot{display:block;width:8px;height:8px;border-radius:50%;margin:0 auto 4px}
  #mtbl .feat{text-align:left;font-size:13px;font-weight:500;color:var(--ink);position:sticky;left:0;background:var(--card);min-width:220px;z-index:1}
  #mtbl tr:hover .feat{background:color-mix(in srgb,var(--teal-soft) 25%,transparent)}
  #mtbl .catrow td{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft);background:var(--paper);padding:9px 12px;font-weight:600}
  #mtbl .catrow .feat{background:var(--paper)}
  #mtbl col.mecol,#mtbl th.mecol,#mtbl td.mecol{background:color-mix(in srgb,var(--teal-soft) 60%,transparent)}
  #mtbl th.mecol{color:var(--teal-ink)}
  #mtbl tr:hover td.mecol{background:color-mix(in srgb,var(--teal-soft) 85%,transparent)}
  #mtbl .scoremrow td{font-family:var(--mono);font-weight:700;font-size:12px;border-top:2px solid var(--line-strong)}
  #mtbl .scoremrow .feat{color:var(--ink)}
  /* documentos electrónicos */
  .docwrap{display:flex;flex-direction:column;gap:8px}
  .docrow{display:grid;grid-template-columns:210px 1fr 116px;gap:14px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow)}
  .docrow.me{border:2px solid var(--teal);background:color-mix(in srgb,var(--teal-soft) 55%,var(--card))}
  .docrow .dc-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
  .docrow .dc-name .dc-plan{color:var(--ink-soft);font-weight:400}
  .docrow.me .dc-name{color:var(--teal-ink)}
  .docbar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;position:relative}
  .docbar i{display:block;height:100%;border-radius:6px;min-width:3px}
  .docbar.nd{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--line-strong) 60%,transparent) 0 4px,transparent 4px 8px)}
  .docval{font-family:var(--mono);font-weight:600;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
  .docval.inf{color:var(--good)} .docval.nd{color:var(--ink-soft);font-weight:400}
  @media (max-width:640px){.docrow{grid-template-columns:1fr 92px;gap:6px 12px}.docrow .docbar{grid-column:1/-1;order:3}}
  /* conclusión comercial */
  .concl{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .cbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
  .cbox.why{grid-column:1/-1;border:2px solid var(--teal);background:linear-gradient(180deg,var(--teal-soft),var(--card) 62%)}
  .cbox.why .k{font-family:var(--disp);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-ink);font-weight:700}
  .cbox.why h3{font-size:clamp(18px,2.4vw,23px);color:var(--teal-ink);margin:6px 0 8px}
  .cbox.why p{font-size:14.5px;color:var(--ink);line-height:1.6}
  .cbox h4{font-family:var(--disp);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:12px}
  .cbox .dif{font-size:14px;color:var(--ink);margin-bottom:14px;line-height:1.55}
  .cbox ul{list-style:none;display:flex;flex-direction:column;gap:9px}
  .cbox li{font-size:13px;color:var(--ink-soft);line-height:1.5;padding-left:18px;position:relative}
  .cbox li::before{content:&quot;▸&quot;;position:absolute;left:0;color:var(--teal);font-weight:700}
  .cbox li b{color:var(--ink);font-weight:600}
  .discurso{display:flex;flex-direction:column;gap:9px}
  .disc{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .disc .t{font-family:var(--disp);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);font-weight:700;margin-bottom:3px}
  .disc .d{font-size:12.5px;color:var(--ink);line-height:1.5}
  @media(max-width:760px){.concl{grid-template-columns:1fr}}
  footer{border-top:1px solid rgba(255,255,255,.12);padding:26px 0 50px;color:rgba(255,255,255,.5);font-size:12px}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .usdnote{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.5);margin-top:10px;max-width:80ch}
  @media (max-width:720px){.sim{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class=&quot;hero&quot;>
  <div class=&quot;wrap&quot;>
    <div class=&quot;brandrow&quot;>
      <span class=&quot;logo-crece&quot;>CRECE<sup>+</sup></span>

function allPlans(m){const a=[];DATA[m].comps.forEach(c=>c.plans.forEach(p=>a.push({...p,comp:c.name,color:c.color})));return a;}
function mePlans(m){return DATA[m].me.plans.map(p=>({...p,comp:&quot;CRECE+&quot;,isMe:true}));}
const priced=p=>typeof p.price==='number'&amp;&amp;isFinite(p.price);
// market stats = competitors only (the reference market); ignora precios sin publicar (null)
function stats(m){const v=allPlans(m).filter(priced).map(p=>p.price).sort((a,b)=>a-b);
  const med=v.length%2?v[(v.length-1)/2]:(v[v.length/2-1]+v[v.length/2])/2;
  return {min:v[0],max:v[v.length-1],med:Math.round(med),vals:v};}
// band scale spans competitors + CRECE+ so all ticks fit
function bandRange(m){const v=[...allPlans(m),...mePlans(m)].filter(priced).map(p=>p.price);return{min:Math.min(...v),max:Math.max(...v)};}
