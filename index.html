function renderBand(you){
  const d=DATA[MK], r=bandRange(MK), min=r.min, max=r.max, span=max-min;
  const strip=$(&quot;#strip&quot;); strip.innerHTML=&quot;&quot;;
  const pos=v=>((v-min)/span)*100;
  strip.insertAdjacentHTML(&quot;beforeend&quot;,`<div class=&quot;track&quot;></div>`);
  // competitors + CRECE+, sorted, packed into staggered rows so labels never collide
  const ticks=[...allPlans(MK),...mePlans(MK)].filter(priced).map(p=>({...p,x:pos(p.price)})).sort((a,b)=>a.x-b.x);
  const stripW=strip.clientWidth||1000;
  const NR=5, rowRight=new Array(NR).fill(-999);
  ticks.forEach(t=>{
    const label=t.isMe?`CRECE+ ${t.plan}`:t.comp;
    const chars=Math.max(label.length, (d.sym+t.price.toLocaleString('es-PE')).length);
    const halfW=((chars*5.6+8)/2)/stripW*100 + 0.6; // half label width, in %
    let row=0; while(row<NR-1 &amp;&amp; t.x-halfW < rowRight[row]) row++;
    rowRight[row]=t.x+halfW; t.row=row;
    strip.insertAdjacentHTML(&quot;beforeend&quot;,`<div class=&quot;tick ${t.isMe?'me':''}&quot; data-row=&quot;${row}&quot; style=&quot;left:${t.x}%&quot;>
      ${t.isMe?'<div class=&quot;mdot&quot;></div>':''}
      <div class=&quot;stem&quot;></div>
      <div class=&quot;lab&quot;>${d.sym}${t.price.toLocaleString('es-PE')}</div>
      <div class=&quot;co&quot; ${t.isMe?'':`style=&quot;color:${t.color}&quot;`}>${label}</div></div>`);
  });
  const yp=Math.max(0,Math.min(100,pos(you)));
  strip.insertAdjacentHTML(&quot;beforeend&quot;,`<div class=&quot;tick you&quot; style=&quot;left:${yp}%&quot;>
    <div class=&quot;col&quot;><div class=&quot;co&quot;>Simular ${fmt(you,d.sym)}</div><div class=&quot;stem&quot;></div></div>
    <div class=&quot;knob&quot;></div></div>`);
  $(&quot;#scaleMin&quot;).textContent=fmt(min,d.sym); $(&quot;#scaleMax&quot;).textContent=fmt(max,d.sym);
}

function renderSim(you){
  const d=DATA[MK], s=stats(MK);
  $(&quot;#sMin&quot;).textContent=fmt(s.min,d.sym); $(&quot;#sMed&quot;).textContent=fmt(s.med,d.sym); $(&quot;#sMax&quot;).textContent=fmt(s.max,d.sym);
  const span=s.max-s.min, pct=Math.max(0,Math.min(100,Math.round((you-s.min)/span*100)));
  $(&quot;#pctfill&quot;).style.width=pct+&quot;%&quot;; $(&quot;#pctlabel&quot;).textContent=`percentil ${pct}`;
  // nearest
  let near=allPlans(MK).filter(priced).reduce((a,b)=>Math.abs(b.price-you)<Math.abs(a.price-you)?b:a);
  $(&quot;#nearest&quot;).innerHTML=`<span class=&quot;comp-dot&quot; style=&quot;background:${near.color}&quot;></span>${near.comp} · ${near.plan} — ${fmt(near.price,d.sym)}`;
  // verdict
  let vt,vx,cls;
  if(you<s.min){vt=&quot;Bajo el mercado&quot;;vx=&quot;Precio agresivo por debajo del piso competitivo. Gana entrada pero deja margen y valor percibido sobre la mesa.&quot;;cls=&quot;b-good&quot;;}
  else if(pct<=33){vt=&quot;Zona de entrada&quot;;vx=&quot;Compites cerca de los planes base. Buen gancho de adquisición; asegúrate de cubrir costos y ruta de upsell.&quot;;cls=&quot;b-good&quot;;}
  else if(pct<=66){vt=&quot;Precio de valor&quot;;vx=&quot;Posición central: percibido como opción sólida sin ser la más cara. Suele ser la zona de mayor conversión.&quot;;cls=&quot;b-mid&quot;;}
  else if(you<=s.max){vt=&quot;Segmento premium&quot;;vx=&quot;Te ubicas en la franja alta. Exige justificar con features, soporte o alcance superior a los rivales.&quot;;cls=&quot;b-mid&quot;;}
  else{vt=&quot;Sobre el techo&quot;;vx=&quot;Superas al plan más caro del mercado. Solo sostenible con propuesta claramente diferenciada o enterprise.&quot;;cls=&quot;b-hot&quot;;}
  const vd=$(&quot;#verdict&quot;); vd.className=&quot;verdict&quot;;
  $(&quot;#vtitle&quot;).textContent=vt; $(&quot;#vtext&quot;).textContent=vx;
  const c=getComputedStyle(document.documentElement).getPropertyValue(cls===&quot;b-good&quot;?&quot;--good&quot;:cls===&quot;b-hot&quot;?&quot;--hot&quot;:&quot;--mid&quot;);
  vd.style.borderColor=c.trim(); $(&quot;#vtitle&quot;).style.color=c.trim();
}

let SORT={k:&quot;price&quot;,asc:true};
function renderTable(){
  const d=DATA[MK]; let rows=[...allPlans(MK),...mePlans(MK)];
  const numOf=v=>typeof v==='number'&amp;&amp;isFinite(v)?v:Infinity;
  rows.sort((a,b)=>{let x=a[SORT.k==='cap'?'cap':SORT.k==='pos'?'price':SORT.k],y=b[SORT.k==='cap'?'cap':SORT.k==='pos'?'price':SORT.k];
    if(SORT.k==='comp')x=a.comp,y=b.comp; if(SORT.k==='plan')x=a.plan,y=b.plan;
    if(typeof x==='string')return SORT.asc?x.localeCompare(y):y.localeCompare(x);
    x=numOf(x);y=numOf(y);
    return SORT.asc?x-y:y-x;});
  const s=stats(MK),span=s.max-s.min;
  const tb=$(&quot;#tbl tbody&quot;); tb.innerHTML=&quot;&quot;;
  rows.forEach(p=>{
    let badge, priceCell;
    if(!priced(p)){
      badge=`<span class=&quot;badge b-nd&quot;>Cotizar</span>`;
      priceCell=`<span style=&quot;color:var(--ink-soft)&quot;>Cotizar</span>`;
    }else{
      const pct=(p.price-s.min)/span;
      let b=pct<=.33?[&quot;b-good&quot;,&quot;Entrada&quot;]:pct<=.66?[&quot;b-mid&quot;,&quot;Valor&quot;]:[&quot;b-hot&quot;,&quot;Premium&quot;];
      if(p.price<s.min)b=[&quot;b-good&quot;,&quot;Bajo mercado&quot;];else if(p.price>s.max)b=[&quot;b-hot&quot;,&quot;Sobre techo&quot;];
      badge=`<span class=&quot;badge ${b[0]}&quot;>${b[1]}</span>`;
      priceCell=`${fmt(p.price,d.sym)}${p.usd?` <span style=&quot;color:var(--ink-soft)&quot;>·$${p.usd}</span>`:''}`;
    }
    tb.insertAdjacentHTML(&quot;beforeend&quot;,`<tr class=&quot;${p.isMe?'merow':''}&quot;>
      <td><span class=&quot;comp-dot&quot; style=&quot;background:${p.isMe?'var(--teal)':p.color}&quot;></span>${p.isMe?'<b>CRECE+</b>':p.comp}</td>
      <td>${p.plan}${p.star?' ★':''}${p.isMe?' <span class=&quot;badge b-me&quot;>TÚ</span>':''}</td>
      <td class=&quot;pr&quot;>${priceCell}</td>
      <td style=&quot;white-space:normal;font-size:12.5px;color:var(--ink-soft)&quot;>${p.cap}</td>
      <td>${badge}</td></tr>`);
  });
  document.querySelectorAll(&quot;#tbl th&quot;).forEach(th=>{th.classList.toggle(&quot;sorted&quot;,th.dataset.s===SORT.k);th.classList.toggle(&quot;asc&quot;,th.dataset.s===SORT.k&amp;&amp;SORT.asc);});
}

function renderMatrix(){
  const d=DATA[MK];
  const cols=[{name:&quot;CRECE+&quot;,color:&quot;var(--teal)&quot;,me:true},...d.comps.map(c=>({name:c.name,color:c.color}))];
  const totalFeats=FEAT.reduce((n,g)=>n+g.rows.length,0);
  // header
  let thead=`<tr><th class=&quot;feat&quot;>Funcionalidad</th>`+
    cols.map(c=>`<th class=&quot;${c.me?'mecol':''}&quot;><span class=&quot;cdot&quot; style=&quot;background:${c.color}&quot;></span>${c.name}</th>`).join(&quot;&quot;)+`</tr>`;
  $(&quot;#mtbl thead&quot;).innerHTML=thead;
  // body
  let body=&quot;&quot;;
  FEAT.forEach(g=>{
    body+=`<tr class=&quot;catrow&quot;><td class=&quot;feat&quot;>${g.cat}</td>${cols.map(c=>`<td class=&quot;${c.me?'mecol':''}&quot;></td>`).join(&quot;&quot;)}</tr>`;
    g.rows.forEach(r=>{
      body+=`<tr><td class=&quot;feat&quot;>${r.name}</td>`+
        cols.map(c=>{const st=(MATRIX[MK][c.name]||{})[r.k]||'';const f=FCELL[st];
          return `<td class=&quot;${c.me?'mecol':''}&quot;><span class=&quot;fc ${f[0]}&quot;>${f[1]}</span></td>`;}).join(&quot;&quot;)+`</tr>`;
    });
  });
  // score row: cobertura ponderada (y=1 · p/e=0.5)
  const score=n=>{let s=0;FEAT.forEach(g=>g.rows.forEach(r=>{const st=(MATRIX[MK][n]||{})[r.k]||'';s+=st==='y'?1:(st==='p'||st==='e')?0.5:0;}));return s;};
  body+=`<tr class=&quot;scoremrow&quot;><td class=&quot;feat&quot;>Cobertura funcional (pond.)</td>`+
    cols.map(c=>`<td class=&quot;${c.me?'mecol':''}&quot;>${score(c.name).toLocaleString('es-PE')}/${totalFeats}</td>`).join(&quot;&quot;)+`</tr>`;
  $(&quot;#mtbl tbody&quot;).innerHTML=body;
}

function renderDocs(){
  const d=DATA[MK];
  const colorOf=n=>n===&quot;CRECE+&quot;?&quot;var(--teal)&quot;:(d.comps.find(c=>c.name===n)||{}).color||&quot;var(--ink-soft)&quot;;
  const rank=q=>q===null?2:(q===Infinity?1:0); // finitos, luego ilimitado, luego sin dato
  const rows=DOCS[MK].slice().sort((a,b)=>rank(a.qty)-rank(b.qty)|| (a.qty-b.qty)|| (a.isMe?-1:b.isMe?1:0));
  const maxFin=Math.max(...DOCS[MK].map(r=>r.qty).filter(q=>q!==null&amp;&amp;q!==Infinity));
  const wrap=$(&quot;#docs&quot;); wrap.innerHTML=&quot;&quot;;
  rows.forEach(r=>{
    const col=colorOf(r.comp);
    let bar,val,vcls=&quot;&quot;;
    if(r.qty===null){bar=`<div class=&quot;docbar nd&quot;></div>`;val=&quot;—&quot;;vcls=&quot;nd&quot;;}
    else if(r.qty===Infinity){bar=`<div class=&quot;docbar&quot;><i style=&quot;width:100%;background:linear-gradient(90deg,var(--good),${col})&quot;></i></div>`;val=&quot;Ilimitado&quot;;vcls=&quot;inf&quot;;}
    else{const w=Math.max(4,Math.log10(r.qty+1)/Math.log10(maxFin+1)*100);
      bar=`<div class=&quot;docbar&quot;><i style=&quot;width:${w}%;background:${col}&quot;></i></div>`;val=r.qty.toLocaleString('es-PE');}
    wrap.insertAdjacentHTML(&quot;beforeend&quot;,`<div class=&quot;docrow ${r.isMe?'me':''}&quot;>
      <div class=&quot;dc-name&quot;><span class=&quot;comp-dot&quot; style=&quot;background:${col}&quot;></span>${r.isMe?'<b>CRECE+</b>':r.comp} <span class=&quot;dc-plan&quot;>· ${r.plan}${r.note?` — ${r.note}`:''}</span></div>
      ${bar}
      <div class=&quot;docval ${vcls}&quot;>${val}</div></div>`);
  });
  $(&quot;#docnote&quot;).textContent=&quot;Concepto CRECE+ (los 3 países): ventas ilimitadas y recibos/comprobantes de venta ilimitados; el tope es solo de DOCUMENTOS ELECTRÓNICOS (DTE). El «Ilimitado» de CRECE+ Max (Colombia) es fair-use ~10.000 DTE/mes POR SUCURSAL con pool a nivel empresa; al superarlo aplica cobro por excedente. Competidores: barras en escala logarítmica; «—» = por volumen de venta o sin cantidad publicada. Cupos actualizados Ago 2026.&quot;;
}

function renderAdic(){
  const d=DATA[MK];
  const tb=$(&quot;#atbl tbody&quot;); tb.innerHTML=&quot;&quot;;
  ADIC[MK].forEach(a=>{
    const priceCell=a.text?`<span style=&quot;color:var(--ink-soft)&quot;>${a.text}</span>`:fmt(a.price,d.sym);
    tb.insertAdjacentHTML(&quot;beforeend&quot;,`<tr>
      <td style=&quot;font-weight:500&quot;>${a.item}</td>
      <td class=&quot;pr&quot;>${priceCell}</td>
      <td class=&quot;num&quot; style=&quot;color:var(--ink-soft)&quot;>${a.uf!=null?a.uf.toLocaleString('es-PE',{minimumFractionDigits:2})+' UF':'—'}</td>
      <td style=&quot;white-space:normal;font-size:12.5px;color:var(--ink-soft)&quot;>${a.ref}</td></tr>`);
  });
  $(&quot;#adicnote&quot;).textContent=&quot;Adicionales netos por sucursal. En CRECE+ cada usuario = una caja, por eso el «Vendedor» se compara con el precio de CAJA del mercado (Siigo cobra una suscripción completa por caja; Loggro $43.990). Admin y Supervisor son roles de gestión. Chile mantiene su tarifa (mercado UF alto); Perú y Colombia se alinean al add-on local.&quot;;
}

function renderConcl(){
  const c=CONCL[MK], d=DATA[MK];
  const vent=c.ventajas.map(v=>`<li>${v}</li>`).join(&quot;&quot;);
  const disc=c.discurso.map(x=>`<div class=&quot;disc&quot;><div class=&quot;t&quot;>${x.t}</div><div class=&quot;d&quot;>${x.d}</div></div>`).join(&quot;&quot;);
  $(&quot;#concl&quot;).innerHTML=`
    <div class=&quot;cbox why&quot;>
      <div class=&quot;k&quot;>Resumen ejecutivo · ¿Por qué contratar CRECE+ en ${d.label}?</div>
      <h3>${c.titulo}</h3>
      <p>${c.resumen}</p>
    </div>
    <div class=&quot;cbox&quot;>
      <h4>Diferenciador &amp;amp; ventajas</h4>
      <div class=&quot;dif&quot;>${c.dif}</div>
      <ul>${vent}</ul>
    </div>
    <div class=&quot;cbox&quot;>
      <h4>Discurso de enganche · consultivo + PNL</h4>
      <div class=&quot;discurso&quot;>${disc}</div>
    </div>`;
}

function refreshAll(you){renderCards();renderBand(you);renderSim(you);renderTable();renderMatrix();renderDocs();renderAdic();renderConcl();}

function setMarket(m){
  MK=m; const d=DATA[m], s=stats(m);
  document.querySelectorAll(&quot;#market button&quot;).forEach(b=>b.setAttribute(&quot;aria-pressed&quot;,b.dataset.mk===m));
  $(&quot;#cursym&quot;).textContent=d.sym; $(&quot;#curhint&quot;).textContent=&quot;(&quot;+d.cur+&quot;)&quot;;
  const start=d.me.plans[1].price; // arranca en CRECE+ Plus
  const step = m===&quot;pe&quot;?1:1000;
  $(&quot;#price&quot;).value=start; $(&quot;#price&quot;).step = step;
  $(&quot;#slider&quot;).min=Math.max(0,Math.round(s.min*0.6)); $(&quot;#slider&quot;).max=Math.round(s.max*1.25); $(&quot;#slider&quot;).step=step; $(&quot;#slider&quot;).value=start;
  refreshAll(start);
}

$(&quot;#price&quot;).addEventListener(&quot;input&quot;,e=>{let v=+e.target.value||0;$(&quot;#slider&quot;).value=v;renderBand(v);renderSim(v);renderTable();});
$(&quot;#slider&quot;).addEventListener(&quot;input&quot;,e=>{let v=+e.target.value;$(&quot;#price&quot;).value=v;renderBand(v);renderSim(v);renderTable();});
document.querySelectorAll(&quot;#market button&quot;).forEach(b=>b.addEventListener(&quot;click&quot;,()=>setMarket(b.dataset.mk)));
document.querySelectorAll(&quot;#tbl th&quot;).forEach(th=>th.addEventListener(&quot;click&quot;,()=>{
  if(SORT.k===th.dataset.s)SORT.asc=!SORT.asc;else{SORT.k=th.dataset.s;SORT.asc=true;}renderTable();}));
setMarket(&quot;pe&quot;);
</script>
