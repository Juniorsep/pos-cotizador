function renderBand(you){
  const d=DATA[MK], r=bandRange(MK), min=r.min, max=r.max, span=max-min;
  const strip=$(&quot;#strip&quot;); strip.innerHTML=&quot;&quot;;
  const pos=v=>((v-min)/span)*100;
  strip.insertAdjacentHTML(&quot;beforeend&quot;,`<div class=&quot;track&quot;></div>`);
  // competitors + CRECE+, sorted, packed into staggered rows so labels never collide
  const ticks=[...allPlans(MK),...mePlans(MK)].filter(priced).map(p=>({...p,x:pos(p.price)})).sort((a,b)=>a.x-b.x);
  const stripW=strip.clientWidth||1000;
  const NR=5, rowRight=new Array(NR).fill(-999);
  ticks.forEach(t=>{
    const label=t.isMe?`CRECE+ ${t.plan}`:t.comp;
    const chars=Math.max(label.length, (d.sym+t.price.toLocaleString('es-PE')).length);
    const halfW=((chars*5.6+8)/2)/stripW*100 + 0.6; // half label width, in %
    let row=0; while(row<NR-1 &amp;&amp; t.x-halfW < rowRight[row]) row++;
    rowRight[row]=t.x+halfW; t.row=row;
    strip.insertAdjacentHTML(&quot;beforeend&quot;,`<div class=&quot;tick ${t.isMe?'me':''}&quot; data-row=&quot;${row}&quot; style=&quot;left:${t.x}%&quot;>
      ${t.isMe?'<div class=&quot;mdot&quot;></div>':''}
      <div class=&quot;stem&quot;></div>
      <div class=&quot;lab&quot;>${d.sym}${t.price.toLocaleString('es-PE')}</div>
      <div class=&quot;co&quot; ${t.isMe?'':`style=&quot;color:${t.color}&quot;`}>${label}</div></div>`);
  });
  const yp=Math.max(0,Math.min(100,pos(you)));
  strip.insertAdjacentHTML(&quot;beforeend&quot;,`<div class=&quot;tick you&quot; style=&quot;left:${yp}%&quot;>
    <div class=&quot;col&quot;><div class=&quot;co&quot;>Simular ${fmt(you,d.sym)}</div><div class=&quot;stem&quot;></div></div>
    <div class=&quot;knob&quot;></div></div>`);
  $(&quot;#scaleMin&quot;).textContent=fmt(min,d.sym); $(&quot;#scaleMax&quot;).textContent=fmt(max,d.sym);
}

        <input id=&quot;q-search&quot; type=&quot;text&quot; placeholder=&quot;Buscar por cliente, documento, razón social…&quot; oninput=&quot;render()&quot;>
        <select id=&quot;q-comercial&quot; class=&quot;hidden&quot; onchange=&quot;render()&quot;><option value=&quot;&quot;>Todos los comerciales</option></select>
        <select id=&quot;q-estado&quot; class=&quot;hidden&quot; onchange=&quot;render()&quot;>
          <option value=&quot;&quot;>Todas las etapas</option>
          <option value=&quot;borrador&quot;>Borrador</option>
          <option value=&quot;enviada&quot;>Enviada</option>
          <option value=&quot;negociacion&quot;>Negociación</option>
          <option value=&quot;aprobado&quot;>Aprobado (cierre)</option>
          <option value=&quot;comisionable&quot;>Comisionable</option>
          <option value=&quot;perdida&quot;>Perdida</option>
        </select>
        <div class=&quot;view-toggle&quot; id=&quot;view-toggle&quot;>
          <button id=&quot;vt-kanban&quot; class=&quot;active&quot; onclick=&quot;setVista('kanban')&quot;>▦ Kanban</button>
          <button id=&quot;vt-lista&quot; onclick=&quot;setVista('lista')&quot;>☰ Lista</button>
        </div>
        <span class=&quot;msg&quot; id=&quot;q-msg&quot;></span>
      </div>
      <div id=&quot;board&quot; class=&quot;board auto&quot;><div class=&quot;empty&quot;>Cargando…</div></div>
      <div id=&quot;list-wrap&quot; class=&quot;auto&quot;><div class=&quot;table-scroll&quot;><div id=&quot;tabla&quot;></div></div></div>
    </div>
  </div>
</div>

<script src=&quot;https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2&quot;></script>
<script>
const SB_URL='https://hjcggilmjxhvxocloxgv.supabase.co';
const SB_KEY='sb_publishable_fb51sssWffX_SziOSEtILQ_WVAk301S';
const PAIS={cl:{f:'🇨🇱',n:'Chile'},pe:{f:'🇵🇪',n:'Perú'},co:{f:'🇨🇴',n:'Colombia'}};
const ESTADOS={borrador:'Borrador',enviada:'Enviada',negociacion:'Negociación',aprobado:'Aprobado (cierre)',comisionable:'Comisionable',perdida:'Perdida'};
// Etapas seleccionables manualmente (comisionable se alcanza con los hitos)
const ETAPAS=['borrador','enviada','negociacion','aprobado','perdida'];
const MODAL={mensual:'Mensual',semestral:'Semestral',anual:'Anual'};
let sb=null, YO=null, ADMIN=false, DATOS=[], PERFILES={}, EXPANDED=null;
try{ sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}); }catch(e){}

function uf(n){ return 'UF '+ (Math.round((n||0)*100)/100).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function qLabel(d){ const r=['I','II','III','IV'][Math.floor(d.getMonth()/3)]; return r+'-'+d.getFullYear(); }
function msg(t,ok){ const el=document.getElementById('q-msg'); if(!el)return; el.textContent=t; el.style.color = ok===false?'var(--red)':(ok?'var(--green)':'var(--g600)'); }

async function init(){
  if(!sb) return;
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ document.getElementById('gate').classList.remove('hidden'); return; }
  const { data:perfil } = await sb.from('perfiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!perfil){ document.getElementById('gate').classList.remove('hidden'); document.querySelector('#gate p').textContent='Tu correo no está autorizado.'; return; }
  YO=perfil; ADMIN=perfil.rol==='admin';
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  if(ADMIN) document.getElementById('q-comercial').classList.remove('hidden');
  await cargar();
}
if(sb){ sb.auth.onAuthStateChange((e,s)=>{ if(s &amp;&amp; !YO) init(); }); }

async function cargar(){
  // RLS filtra: vendedor ve solo las suyas; admin ve todas.
  const q = sb.from('cotizaciones').select('*').eq('activa',true).order('created_at',{ascending:false});
  const { data:cots=[], error } = await q;
  if(error){ msg('Error al cargar: '+error.message,false); return; }
  DATOS=cots||[];
  if(ADMIN){
    const { data:perfiles=[] } = await sb.from('perfiles').select('*');
    PERFILES={}; (perfiles||[]).forEach(p=>PERFILES[p.id]=p);
    const sel=document.getElementById('q-comercial'); const actual=sel.value;
    const ids=[...new Set(DATOS.map(r=>r.perfil_id))];
    sel.innerHTML='<option value=&quot;&quot;>Todos los comerciales</option>'+(perfiles||[]).filter(p=>p.rol==='vendedor'||ids.includes(p.id)).map(p=>'<option value=&quot;'+p.id+'&quot;>'+(p.nombre||p.email)+'</option>').join('');
    sel.value=actual;
  }
  render();
}

function filtradas(){
  const term=(document.getElementById('q-search').value||'').toLowerCase();
  const comId=ADMIN?document.getElementById('q-comercial').value:'';
  const est=document.getElementById('q-estado').value;
  let rows=DATOS.slice();
  if(comId) rows=rows.filter(r=>r.perfil_id===comId);
  if(est) rows=rows.filter(r=>(r.estado||'borrador')===est);
  if(term) rows=rows.filter(r=>((r.razon_social||'')+' '+(r.documento||'')+' '+(r.representante_nombre||'')+' '+((r.datos&amp;&amp;r.datos.form&amp;&amp;r.datos.form.clienteNombre)||'')+' '+(r.comercial_email||'')).toLowerCase().includes(term));
  return rows;
}

const STAGES=[
  {k:'borrador',t:'Borrador',bar:'#888780',ink:'#444441'},
  {k:'enviada',t:'Enviada',bar:'#378ADD',ink:'#0C447C'},
  {k:'negociacion',t:'Negociación',bar:'#BA7517',ink:'#633806'},
  {k:'aprobado',t:'Aprobado · cierre',bar:'#7F77DD',ink:'#3C3489'},
  {k:'comisionable',t:'Comisionable',bar:'#1D9E75',ink:'#085041'},
  {k:'perdida',t:'Perdida',bar:'#E24B4A',ink:'#791F1F'},
];
let VISTA='kanban', dragId=null;
function nombreCli(r){ return r.razon_social||(r.datos&amp;&amp;r.datos.form&amp;&amp;r.datos.form.clienteNombre)||'—'; }

function setVista(v){
  VISTA=v;
  document.getElementById('vt-kanban').classList.toggle('active',v==='kanban');
  document.getElementById('vt-lista').classList.toggle('active',v==='lista');
  const b=document.getElementById('board'), l=document.getElementById('list-wrap');
  b.classList.remove('auto'); l.classList.remove('auto');
  b.style.display=v==='kanban'?'':'none'; l.style.display=v==='lista'?'':'none';
  render();
}

function render(){
  const rows=filtradas();
  const funnel=document.getElementById('funnel');
  funnel.innerHTML=STAGES.map(s=>{
    const qr=rows.filter(r=>(r.estado||'borrador')===s.k);
    const venta=qr.reduce((a,r)=>a+(r.venta_uf||0),0);
    return '<div class=&quot;f-card&quot;><div class=&quot;f-n&quot;>'+qr.length+'</div><div class=&quot;f-t&quot;>'+s.t.replace(' · cierre','')+'</div><div class=&quot;f-v&quot;>'+uf(venta)+'</div></div>';
  }).join('');
  renderBoard(rows); renderList(rows);
}

function renderBoard(rows){
  const board=document.getElementById('board');
  board.innerHTML=STAGES.map(s=>{
    const list=rows.filter(r=>(r.estado||'borrador')===s.k);
    const sum=list.reduce((a,r)=>a+(r.recurrente_uf||0),0);
    return '<div class=&quot;kcol&quot; data-stage=&quot;'+s.k+'&quot;>'
      +'<div class=&quot;kcol-head&quot; style=&quot;border-left:3px solid '+s.bar+';&quot;><div class=&quot;kcol-title&quot; style=&quot;color:'+s.ink+'&quot;>'+s.t+'</div><div class=&quot;kcol-sub&quot;>'+list.length+' · '+uf(sum)+'</div></div>'
      +'<div class=&quot;kdrop&quot; data-stage=&quot;'+s.k+'&quot;>'+(list.length?list.map(kcardHTML).join(''):'<div class=&quot;kempty&quot;>Suelta aquí</div>')+'</div>'
    +'</div>';
  }).join('');
  bindDnD();
}

function kcardHTML(r){
  const pais=PAIS[r.pais]||{f:'',n:r.pais||''};
  const fl=(on,label)=>'<span class=&quot;kflag '+(on?'on':'off')+'&quot;>'+(on?'✓ ':'○ ')+label+'</span>';
  const canEdit=true;
  return '<div class=&quot;kcard&quot; draggable=&quot;true&quot; data-id=&quot;'+r.id+'&quot;>'
    +'<div class=&quot;kc-top&quot;><span class=&quot;kc-cli&quot;>'+nombreCli(r)+'</span><span class=&quot;kc-pais&quot;>'+pais.f+' '+(r.pais||'').toUpperCase()+'</span></div>'
    +'<div class=&quot;kc-doc&quot;>'+(r.tipo_doc||'')+' '+(r.documento||'')+'</div>'
    +'<div class=&quot;kc-mid&quot;><span>'+(MODAL[r.modalidad]||r.modalidad||'—')+'</span><span class=&quot;kc-rec&quot;>'+uf(r.recurrente_uf)+'<span style=&quot;color:var(--g400);font-weight:400&quot;>/mes</span></span></div>'
    +'<div class=&quot;kflags&quot;>'+fl(r.contrato_firmado,'Firmado')+fl(r.en_produccion,'Producción')+'</div>'
    +'<div class=&quot;kacts&quot;><button class=&quot;kbtn&quot; onclick=&quot;verDetalle(\''+r.id+'\')&quot;>Ver</button>'
      +(canEdit?'<button class=&quot;kbtn&quot; onclick=&quot;editar(\''+r.id+'\')&quot;>Editar</button>':'')
      +'<button class=&quot;kbtn red&quot; onclick=&quot;eliminar(\''+r.id+'\')&quot;>🗑</button></div>'
  +'</div>';
}

function bindDnD(){
  document.querySelectorAll('.kcard').forEach(el=>{
    el.addEventListener('dragstart',()=>{ dragId=el.dataset.id; el.classList.add('drag'); });
    el.addEventListener('dragend',()=>el.classList.remove('drag'));
  });
  document.querySelectorAll('.kcol').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{ e.preventDefault(); col.classList.remove('over'); onDrop(dragId, col.dataset.stage); });
  });
}

async function onDrop(id,dest){
  const r=getRow(id); if(!r) return;
  const actual=r.estado||'borrador';
  if(dest===actual) return;
  if(dest==='comisionable'){ abrirModalComisionable(r); return; }
  if(await persist(id,{estado:dest})){ msg(nombreCli(r)+' → '+(ESTADOS[dest]||dest)+'.',true); render(); }
}

function abrirModalComisionable(r){
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modal-bg';
  bg.innerHTML='<div class=&quot;modal&quot;><h3>Pasar a comisionable</h3>'
    +'<p>Para que <b>'+nombreCli(r)+'</b> entre en la comisión del trimestre, confirma los dos hitos:</p>'
    +'<label class=&quot;chk&quot;><input type=&quot;checkbox&quot; id=&quot;m-firm&quot; '+(r.contrato_firmado?'checked':'')+' onchange=&quot;mSync()&quot;><span><span class=&quot;lbl&quot;>Contrato firmado</span><span class=&quot;d&quot;>El cliente firmó el contrato.</span></span></label>'
    +'<label class=&quot;chk&quot;><input type=&quot;checkbox&quot; id=&quot;m-prod&quot; '+(r.en_produccion?'checked':'')+' onchange=&quot;mSync()&quot;><span><span class=&quot;lbl&quot;>En producción</span><span class=&quot;d&quot;>El cliente ya está operando en la plataforma.</span></span></label>'
    +'<div class=&quot;note&quot;>⚠️ Estos estados serán <b>validados por el administrador</b> antes de liquidar la comisión.</div>'
    +'<div class=&quot;m-acts&quot;><button class=&quot;m-btn&quot; onclick=&quot;cerrarModal()&quot;>Cancelar</button><button class=&quot;m-btn primary&quot; id=&quot;m-ok&quot; onclick=&quot;confirmarComisionable(\''+r.id+'\')&quot;>Marcar comisionable</button></div>'
  +'</div>';
  document.body.appendChild(bg);
  bg.addEventListener('click',e=>{ if(e.target===bg) cerrarModal(); });
  mSync();
}
function mSync(){ const f=document.getElementById('m-firm'), p=document.getElementById('m-prod'), b=document.getElementById('m-ok'); if(b) b.disabled=!(f.checked&amp;&amp;p.checked); }
function cerrarModal(){ const m=document.getElementById('modal-bg'); if(m) m.remove(); render(); }
async function confirmarComisionable(id){
  const f=document.getElementById('m-firm').checked, p=document.getElementById('m-prod').checked;
  if(!(f&amp;&amp;p)) return;
  const r=getRow(id);
  const upd={contrato_firmado:true, en_produccion:true, estado:'comisionable'};
  if(!r.trimestre){ upd.trimestre=qLabel(new Date()); upd.anio=new Date().getFullYear(); }
  if(await persist(id,upd)){ cerrarModal(); msg('✓ '+nombreCli(r)+' es comisionable ('+(upd.trimestre||r.trimestre)+').',true); }
}

function verDetalle(id){
  const r=getRow(id); if(!r) return;
  const c=(r.datos&amp;&amp;r.datos.cotizacion)||{};
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modal-bg';
  const g=(k,v)=>'<div><span class=&quot;k&quot; style=&quot;color:var(--g400);font-size:11px&quot;>'+k+'</span><br><span style=&quot;font-size:13px&quot;>'+v+'</span></div>';
  bg.innerHTML='<div class=&quot;modal&quot; style=&quot;max-width:480px&quot;><h3>'+nombreCli(r)+'</h3>'
    +'<div class=&quot;det-grid&quot; style=&quot;margin-bottom:10px&quot;>'
      +g(r.tipo_doc||'Documento', r.documento||'—')
      +g('Representante',(r.representante_nombre||'—')+(r.representante_doc?(' · '+r.representante_doc):''))
      +g('País',(PAIS[r.pais]||{f:'',n:r.pais}).f+' '+(PAIS[r.pais]||{n:r.pais}).n)
      +g('Sucursales', r.sucursales||0)
      +g('Plan', c.plan||'—')
      +g('Modalidad', MODAL[r.modalidad]||r.modalidad||'—')
      +g('Recurrente mensual neto', uf(c.ufNetoConDesc!=null?c.ufNetoConDesc:r.recurrente_uf))
      +g('Venta total', uf(r.venta_uf))
      +g('Comisión estimada', uf(r.comision_uf))
      +g('Etapa', ESTADOS[r.estado||'borrador']+(r.trimestre?(' · '+r.trimestre):''))
    +'</div>'
    +'<div class=&quot;note&quot; style=&quot;background:#faf8ff;border-color:var(--g200);color:var(--g600)&quot;>La comisión definitiva se calcula al consolidar el trimestre en la pestaña Comisiones (solo oportunidades comisionables).</div>'
    +'<div class=&quot;m-acts&quot;><button class=&quot;m-btn&quot; onclick=&quot;cerrarModal()&quot;>Cerrar</button></div>'
  +'</div>';
  document.body.appendChild(bg);
  bg.addEventListener('click',e=>{ if(e.target===bg) cerrarModal(); });
}

function renderList(rows){
  const cont=document.getElementById('tabla');
  if(!rows.length){ cont.innerHTML='<div class=&quot;empty&quot;>Sin oportunidades para el filtro.</div>'; return; }
  const body=rows.map(r=>rowHTML(r)).join('');
  const comColH=ADMIN?'<th>Comercial</th>':'';
  cont.innerHTML='<table><thead><tr><th>Cliente</th>'+comColH+'<th>País</th><th>Modalidad</th><th class=&quot;r&quot;>Recurrente</th><th class=&quot;r&quot;>Venta</th><th class=&quot;r&quot;>Com. est.</th><th>Etapa</th><th>Hitos</th><th class=&quot;r&quot;>Acciones</th></tr></thead><tbody>'+body+'</tbody></table>';
}

function rowHTML(r){
  const est=r.estado||'borrador';
  const pais=PAIS[r.pais]||{f:'',n:r.pais||''};
  const nom=r.razon_social||(r.datos&amp;&amp;r.datos.form&amp;&amp;r.datos.form.clienteNombre)||'—';
  const puedeEditar = true;
  const comCol = ADMIN ? ('<td>'+((PERFILES[r.perfil_id]||{}).nombre||r.comercial_email||'')+'</td>') : '';
  // selector de etapa (no permite elegir comisionable manualmente)
  let selEst;
  if(est==='comisionable'){
    selEst='<span class=&quot;est comisionable&quot;>Comisionable</span>';
  }else{
    selEst='<select class=&quot;sel-est&quot; onchange=&quot;cambiarEstado(\''+r.id+'\',this.value)&quot;>'+ETAPAS.map(e=>'<option value=&quot;'+e+'&quot;'+(e===est?' selected':'')+'>'+ESTADOS[e]+'</option>').join('')+'</select>';
  }
  const firm='<label class=&quot;flag-chk&quot;><input type=&quot;checkbox&quot; '+(r.contrato_firmado?'checked':'')+' onchange=&quot;toggleFlag(\''+r.id+'\',\'contrato_firmado\',this.checked)&quot;>Firmado</label>';
  const prod='<label class=&quot;flag-chk&quot;><input type=&quot;checkbox&quot; '+(r.en_produccion?'checked':'')+' onchange=&quot;toggleFlag(\''+r.id+'\',\'en_produccion\',this.checked)&quot;>Producción</label>';
  let acc='<button class=&quot;btn-mini&quot; onclick=&quot;toggleDet(\''+r.id+'\')&quot;>👁️ Ver</button>';
  if(puedeEditar) acc+='<button class=&quot;btn-mini gold&quot; onclick=&quot;editar(\''+r.id+'\')&quot;>✏️ Editar</button>';
  acc+='<button class=&quot;btn-mini red&quot; onclick=&quot;eliminar(\''+r.id+'\')&quot;>🗑</button>';
  let row='<tr>'+
    '<td><div class=&quot;cli-cell&quot;>'+nom+'</div><div class=&quot;cli-sub&quot;>'+(r.tipo_doc||'')+' '+(r.documento||'')+'</div></td>'+
    comCol+
    '<td>'+pais.f+' '+pais.n+'</td>'+
    '<td>'+(MODAL[r.modalidad]||r.modalidad||'—')+'</td>'+
    '<td class=&quot;r&quot;>'+uf(r.recurrente_uf)+'</td>'+
    '<td class=&quot;r&quot;>'+uf(r.venta_uf)+'</td>'+
    '<td class=&quot;r&quot;>'+uf(r.comision_uf)+'</td>'+
    '<td>'+selEst+(r.trimestre?'<div class=&quot;cli-sub&quot;>'+r.trimestre+'</div>':'')+'</td>'+
    '<td><div style=&quot;display:flex;flex-direction:column;gap:3px&quot;>'+firm+prod+'</div></td>'+
    '<td class=&quot;r&quot;>'+acc+'</td></tr>';
  if(EXPANDED===r.id) row+=detalleRow(r);
  return row;
}

function detalleRow(r){
  const c=(r.datos&amp;&amp;r.datos.cotizacion)||{};
  const colspan=ADMIN?10:9;
  return '<tr class=&quot;detalle&quot;><td colspan=&quot;'+colspan+'&quot;>'+
    '<div class=&quot;det-grid&quot;>'+
      '<div><span class=&quot;k&quot;>Razón social</span><br>'+(r.razon_social||'—')+'</div>'+
      '<div><span class=&quot;k&quot;>'+(r.tipo_doc||'Documento')+'</span><br>'+(r.documento||'—')+'</div>'+
      '<div><span class=&quot;k&quot;>Representante</span><br>'+(r.representante_nombre||'—')+(r.representante_doc?(' · '+r.representante_doc):'')+'</div>'+
      '<div><span class=&quot;k&quot;>Sucursales</span><br>'+(r.sucursales||0)+'</div>'+
      '<div><span class=&quot;k&quot;>Plan</span><br>'+(c.plan||'—')+'</div>'+
      '<div><span class=&quot;k&quot;>Recurrente mensual neto</span><br>'+uf(c.ufNetoConDesc!=null?c.ufNetoConDesc:r.recurrente_uf)+'</div>'+
      '<div><span class=&quot;k&quot;>Modalidad</span><br>'+(MODAL[r.modalidad]||r.modalidad||'—')+'</div>'+
      '<div><span class=&quot;k&quot;>Creada</span><br>'+((r.created_at||'').slice(0,10)||'—')+'</div>'+
    '</div>'+
    '<div class=&quot;cli-sub&quot; style=&quot;margin-top:8px&quot;>La comisión definitiva se calcula al consolidar el trimestre en la pestaña Comisiones (solo oportunidades comisionables).</div>'+
    '</td></tr>';
}
function toggleDet(id){ EXPANDED=EXPANDED===id?null:id; render(); }

function getRow(id){ return DATOS.find(r=>r.id===id); }

async function persist(id,upd){
  upd.updated_at=new Date().toISOString();
  const { error } = await sb.from('cotizaciones').update(upd).eq('id',id);
  if(error){ msg('Error: '+error.message,false); return false; }
  const r=getRow(id); if(r) Object.assign(r,upd);
  return true;
}

// Si está aprobado y tiene ambos hitos → comisionable; si baja un hito estando comisionable → vuelve a aprobado
function reconciliarComisionable(r,upd){
  const est = upd.estado!=null?upd.estado:r.estado;
  const firm = upd.contrato_firmado!=null?upd.contrato_firmado:r.contrato_firmado;
  const prod = upd.en_produccion!=null?upd.en_produccion:r.en_produccion;
  if((est==='aprobado'||est==='comisionable') &amp;&amp; firm &amp;&amp; prod){
    upd.estado='comisionable';
    if(!r.trimestre){ upd.trimestre=qLabel(new Date()); upd.anio=new Date().getFullYear(); }
  } else if(est==='comisionable' &amp;&amp; !(firm&amp;&amp;prod)){
    upd.estado='aprobado';
  }
  return upd;
}

async function cambiarEstado(id,nuevo){
  const r=getRow(id); if(!r) return;
  let upd={estado:nuevo};
  upd=reconciliarComisionable(r,upd);
  if(await persist(id,upd)){ msg('Etapa actualizada.',true); render(); }
}
async function toggleFlag(id,campo,val){
  const r=getRow(id); if(!r) return;
  let upd={[campo]:val};
  upd=reconciliarComisionable(r,upd);
  if(await persist(id,upd)){
    if(upd.estado==='comisionable') msg('✓ Oportunidad comisionable ('+(upd.trimestre||r.trimestre)+').',true);
    else msg('Hito actualizado.',true);
    render();
  }
}

function editar(id){
  const r=getRow(id); if(!r) return;
  try{
    const cotWin=parent&amp;&amp;parent.document&amp;&amp;parent.document.getElementById('f-cot')&amp;&amp;parent.document.getElementById('f-cot').contentWindow;
    if(cotWin &amp;&amp; typeof cotWin.cargarOportunidad==='function'){
      cotWin.cargarOportunidad(r);
      const btn=parent.document.querySelector('.nav-item[data-t=&quot;cot&quot;]'); if(btn) btn.click();
      return;
    }
  }catch(e){ console.warn('editar',e); }
  msg('Abre el Cotizador desde el menú para editar (o recarga la suite).',false);
}

async function eliminar(id){
  const r=getRow(id); if(!r) return;

    </div>
  </div>

  <!-- 2 · VENTAS -->
  <div class=&quot;card editor-only&quot;>
    <div class=&quot;card-head&quot;>
      <div class=&quot;card-label&quot;>Paso 2 · Ventas</div>
      <h2>Ventas del trimestre</h2>
      <p>Catálogo fijo por país: escribe solo las cantidades de lo vendido. El precio mensual viene precargado en la moneda del país (🇨🇱 UF · 🇵🇪 S/ · 🇨🇴 $ COP) y es editable; muestra su equivalencia en UF. Cada sucursal suma a la meta; los contratos se trimestralizan a su mensual-equivalente.</p>

    </div>
    <div class=&quot;card-body&quot;>
      <div class=&quot;reglas&quot;>
        <b>Condición de pago:</b> la comisión se paga solo si el cliente está <b>en producción</b> y con <b>contrato firmado</b>. Sin ambas condiciones la venta no genera comisión.<br>
        <b>Corte de facturación:</b> los negocios que se consideran para el cierre de un trimestre deben estar <b>facturados antes de los primeros 5 días del mes anterior al trimestre de cierre</b>.<br>
        <b>Servicio mensual:</b> recurrente × % según tramo de cumplimiento — &amp;lt;80% = 25%, 80–120% = 50%, &amp;gt;120% = 60%.<br>
        <b>Implementación:</b> 12% del valor de implementación.<br>
        <b>Contrato semestral:</b> recurrente × meses cobrados × 5%. &amp;nbsp;<b>Contrato anual:</b> recurrente × meses cobrados × 10%.<br>
        <b>Meses cobrados</b> = los efectivamente pagados por el cliente (promos: 12 paga 10/11, 6 paga 5). El cliente paga anticipado.<br>
        <b>Acelerador:</b> si el alcance supera 120%, los componentes de monto fijo (contratos e implementación) se multiplican ×1,10.<br>
        <b>Clawback:</b> solo servicio mensual; una baja antes de 90 días se descuenta en el trimestre siguiente.<br>
        <b>Igualdad entre países:</b> mismas reglas y porcentajes en CL/PE/CO; todo se liquida en UF.
      </div>
    </div>
  </div>

</div>

<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js&quot;></script>
<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js&quot;></script>
<script src=&quot;https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2&quot;></script>
<script>
// ═══════════════════════════════════
//  CONFIG PAÍSES (reutilizado del cotizador)
// ═══════════════════════════════════
const PAISES = {
  cl:{ nombre:'Chile',flag:'🇨🇱',moneda:'CLP', captura:'uf', inPre:'UF ', inDec:2,
    tasas:[{id:'uf_clp',label:'UF → CLP',defaultVal:41074,desc:'CLP por 1 UF'}],
    convertir(uf,t){const v=uf*t.uf_clp;return{principal:fmtN(v,'$',0,'CLP'),secundario:null}} },
  pe:{ nombre:'Perú',flag:'🇵🇪',moneda:'PEN', captura:'local', inPre:'S/ ', inDec:2,
    tasas:[{id:'uf_usd',label:'UF → USD',defaultVal:41.75,desc:'USD por 1 UF'},{id:'usd_pen',label:'USD → S/',defaultVal:3.45,desc:'Soles por 1 USD'}],
    convertir(uf,t){const usd=uf*t.uf_usd;const pen=usd*t.usd_pen;return{principal:fmtN(pen,'S/',2,'PEN'),secundario:fmtN(usd,'USD ',2,'USD')}} },
  co:{ nombre:'Colombia',flag:'🇨🇴',moneda:'COP', captura:'local', inPre:'$ ', inDec:0,
    tasas:[{id:'uf_usd',label:'UF → USD',defaultVal:41.75,desc:'USD por 1 UF'},{id:'usd_cop',label:'USD → COP',defaultVal:3308,desc:'COP por 1 USD'}],
    convertir(uf,t){const usd=uf*t.uf_usd;const cop=usd*t.usd_cop;return{principal:fmtN(cop,'$',0,'COP'),secundario:fmtN(usd,'USD ',2,'USD')}} },
};
// 1 UF expresado en la moneda local del país (factor de conversión)
function factorLocal(paisKey){ return (PAISES[paisKey]||PAISES.cl).convertir(1,TASAS).principal.val; }
// Convierte un monto capturado (UF en Chile, moneda local en PE/CO) a UF
function montoAUF(paisKey,monto){ const m=parseFloat(monto)||0; return (PAISES[paisKey]||PAISES.cl).captura==='uf' ? m : m/(factorLocal(paisKey)||1); }
// Precio del plan expresado en la unidad de captura del país (UF en CL, local en PE/CO)
function planEnCaptura(paisKey,planKey){ if(planKey==='manual') return 0; const p=PAISES[paisKey]||PAISES.cl; const u=planUF(paisKey,planKey); const val=p.captura==='uf'?u:u*factorLocal(paisKey); const f=Math.pow(10,p.inDec); return Math.round(val*f)/f; }
const TASAS={uf_clp:41074,uf_usd:41.75,usd_pen:3.45,usd_cop:3308};
function fmtN(val,pre,dec,suf){return{val,str:pre+val.toLocaleString('es-CL',{minimumFractionDigits:dec,maximumFractionDigits:dec})+(suf&amp;&amp;dec===0?' '+suf:'')};}

// Planes y precio UF por país (reutilizado del cotizador)
const PLANES={ basic:{nombre:'Basic'}, plus:{nombre:'Plus'}, max:{nombre:'Max'} };
const PLAN_UF={
  cl:{ basic:0.9, plus:1.5,      max:2.0      },
  pe:{ basic:0.6, plus:0.928059, max:1.248079 },
  co:{ basic:0.6, plus:1.0,      max:1.5      },
};
function planUF(paisKey,planKey){ if(planKey==='manual') return 0; return (PLAN_UF[paisKey]||PLAN_UF.cl)[planKey] ?? 0; }

// ═══════════════════════════════════
//  REGLAS DE COMISIÓN
// ═══════════════════════════════════
const TRAMOS=[{max:0.80,pct:0.25},{max:1.20,pct:0.50},{max:Infinity,pct:0.60}];
const COM={ impl:0.12, anual:0.10, semestral:0.05, aceleradorFijos:1.10, umbralAcelerador:1.20 };
const MESES_DEFAULT={ anual:12, semestral:6, mensual:0 };
function tramoPct(alcance){ for(const t of TRAMOS){ if(alcance<t.max) return t.pct; } return TRAMOS[TRAMOS.length-1].pct; }

// ═══════════════════════════════════
//  ESTADO · catálogo fijo por país
// ═══════════════════════════════════
let _uid=0;
// Catálogo: planes del cotizador + una fila &quot;Otro&quot; de monto libre por país
const PLAN_CATALOGO=[['basic','Basic'],['plus','Plus'],['max','Max'],['otro','Otro']];
const S={ comercial:'', periodo:'', paisComercial:'cl', metaUF:30, lineas:[], ajustes:[] };

// Una línea por país × plan. Campos de cantidad por modalidad + implementación.
// monto = precio mensual por sucursal en la unidad del país (UF en CL, local en PE/CO).
function construirLineas(){
  S.lineas=[];
  Object.keys(PAISES).forEach(pais=>{
    PLAN_CATALOGO.forEach(([plan])=>{
      S.lineas.push({ id:'g_'+pais+'_'+plan, pais, plan, concepto:'',
        monto: plan==='otro'?0:planEnCaptura(pais,plan),
        sucM:0, sucS:0, mesesS:MESES_DEFAULT.semestral, sucA:0, mesesA:MESES_DEFAULT.anual, impl:0 });
    });
  });
}
function lineaKey(l){ return l.id || (l.pais+'_'+l.plan); }
function getLinea(key){ return S.lineas.find(l=>lineaKey(l)===key); }
function nuevoAjuste(){ return { id:++_uid, concepto:'', uf:0 }; }

// ── Moneda del comercial (unidad en que se liquida la comisión) ──
function ufFmt(v){ return (Math.round(v*100)/100).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function montoEnPais(k,ufVal){ const p=PAISES[k]||PAISES.cl; return p.captura==='uf' ? 'UF '+ufFmt(ufVal) : p.convertir(Math.max(ufVal,0),TASAS).principal.str; }
function comMon(ufVal){ return montoEnPais(S.paisComercial,ufVal); }  // comisión en moneda del comercial

function montoUFlinea(l){ return montoAUF(l.pais, l.monto); }
function sucTotales(l){ return (parseFloat(l.sucM)||0)+(parseFloat(l.sucS)||0)+(parseFloat(l.sucA)||0); }
function recMensualUF(l){ return montoUFlinea(l)*sucTotales(l); }  // aporte a la meta
function implUFde(l){ return montoAUF(l.pais, l.impl); }
function lineaActiva(l){ return sucTotales(l)>0 || (parseFloat(l.impl)||0)>0; }

// ═══════════════════════════════════
//  CÁLCULO
// ═══════════════════════════════════
function calcComisiones(){
  const ingresoUF = S.lineas.reduce((s,l)=>s+recMensualUF(l),0);
  const alcance = S.metaUF>0 ? ingresoUF/S.metaUF : 0;
  const pct = tramoPct(alcance);
  const acel = alcance>COM.umbralAcelerador ? COM.aceleradorFijos : 1;

  let comMensual=0, comContratos=0, comImpl=0, ventaTotalUF=0;
  const porLinea={};
  const ventaPorPais={}; Object.keys(PAISES).forEach(k=>ventaPorPais[k]=0);
  for(const l of S.lineas){
    const mUF=montoUFlinea(l);
    const cM = mUF*(parseFloat(l.sucM)||0)*pct;
    const cS = mUF*(parseFloat(l.sucS)||0)*(parseFloat(l.mesesS)||0)*COM.semestral*acel;
    const cA = mUF*(parseFloat(l.sucA)||0)*(parseFloat(l.mesesA)||0)*COM.anual*acel;
    const cI = implUFde(l)*COM.impl*acel;
    // Monto total de venta (base sobre la que se liquida): mensual (1 mes) + contratos (recurrente × meses) + implementación
    const ventaLinea = mUF*(parseFloat(l.sucM)||0)
                  + mUF*(parseFloat(l.sucS)||0)*(parseFloat(l.mesesS)||0)
                  + mUF*(parseFloat(l.sucA)||0)*(parseFloat(l.mesesA)||0)
                  + implUFde(l);
    ventaTotalUF += ventaLinea;
    ventaPorPais[l.pais] = (ventaPorPais[l.pais]||0) + ventaLinea;
    comMensual+=cM; comContratos+=cS+cA; comImpl+=cI;
    porLinea[lineaKey(l)] = cM+cS+cA+cI;
  }

  const clawback = S.ajustes.reduce((s,a)=>s+(parseFloat(a.uf)||0),0);
  const totalUF = comMensual + comContratos + comImpl - clawback;
  const activos = S.lineas.filter(lineaActiva).length;

  return { ingresoUF, alcance, pct, acel, comMensual, comContratos, comImpl, clawback, totalUF, porLinea, activos, ventaTotalUF, ventaPorPais };
}

// ═══════════════════════════════════
//  RENDER · TASAS
// ═══════════════════════════════════
function renderTasas(){
  const vistos=new Set(); const campos=[];
  Object.values(PAISES).forEach(p=>p.tasas.forEach(t=>{ if(!vistos.has(t.id)){ vistos.add(t.id); campos.push(t); } }));
  document.getElementById('tasas-grid').innerHTML = campos.map(t=>`
    <div class=&quot;tasa-field&quot;>
      <label>${t.label}</label>
      <div class=&quot;tasa-input-wrap&quot;>
        <input type=&quot;number&quot; value=&quot;${TASAS[t.id]}&quot; oninput=&quot;TASAS['${t.id}']=parseFloat(this.value)||0;recalc()&quot;>
        <span>${t.desc}</span>
      </div>
    </div>`).join('');
}

// ═══════════════════════════════════
//  RENDER · VENTAS (grilla fija por país)
// ═══════════════════════════════════
function equivTxt(l){
  const p=PAISES[l.pais]||PAISES.cl;
  if(p.captura==='uf'){ return '≈ '+p.convertir(montoAUF(l.pais,l.monto),TASAS).principal.str; }
  return '≈ '+montoAUF(l.pais,l.monto).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2})+' UF';
}
function lineaRowHTML(l){
  const p=PAISES[l.pais]||PAISES.cl; const key=lineaKey(l);
  const step = p.inDec===0?'1':'0.01';
  const planNom=(PLAN_CATALOGO.find(x=>x[0]===l.plan)||[,l.plan])[1];
  const planLbl = l.cliente
    ? `<span class=&quot;plan-lbl&quot;>${String(l.cliente).replace(/</g,'&amp;lt;')}</span><span class=&quot;th-sub&quot; style=&quot;display:block;color:var(--g400)&quot;>${planNom} · oportunidad</span>`
    : (l.plan==='otro'
      ? `<input class=&quot;otro-inp&quot; type=&quot;text&quot; value=&quot;${(l.concepto||'').replace(/&quot;/g,'&amp;quot;')}&quot; placeholder=&quot;Otro (concepto)&quot; oninput=&quot;updL('${key}','concepto',this.value)&quot;>`
      : `<span class=&quot;plan-lbl&quot;>${planNom}</span>`);
  const money=(field)=>`<span class=&quot;cell-money&quot;><span class=&quot;pre&quot;>${p.inPre.trim()}</span><input type=&quot;number&quot; min=&quot;0&quot; step=&quot;${step}&quot; value=&quot;${l[field]||''}&quot; placeholder=&quot;0&quot; oninput=&quot;updL('${key}','${field}',this.value)&quot;></span>`;
  const n=(field)=>`<input class=&quot;cell-num sm&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;1&quot; value=&quot;${l[field]||''}&quot; placeholder=&quot;0&quot; oninput=&quot;updL('${key}','${field}',this.value)&quot;>`;
  return `
    <td class=&quot;plan-cell&quot;>${planLbl}</td>
    <td class=&quot;r&quot;>${money('monto')}</td>
    <td class=&quot;r&quot;><span class=&quot;v-equiv&quot; id=&quot;eq-${key}&quot;>${equivTxt(l)}</span></td>
    <td class=&quot;r&quot;>${n('sucM')}</td>
    <td class=&quot;r&quot;><span class=&quot;mini-pair&quot;>${n('sucS')}<span class=&quot;mx&quot;>×</span><input class=&quot;cell-num sm&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;1&quot; value=&quot;${l.mesesS}&quot; oninput=&quot;updL('${key}','mesesS',this.value)&quot;><span class=&quot;mini-lbl&quot;>m</span></span></td>
    <td class=&quot;r&quot;><span class=&quot;mini-pair&quot;>${n('sucA')}<span class=&quot;mx&quot;>×</span><input class=&quot;cell-num sm&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;1&quot; value=&quot;${l.mesesA}&quot; oninput=&quot;updL('${key}','mesesA',this.value)&quot;><span class=&quot;mini-lbl&quot;>m</span></span></td>
    <td class=&quot;r&quot;>${money('impl')}</td>
    <td class=&quot;r&quot;><span class=&quot;v-readout v-com&quot; id=&quot;cm-${key}&quot;>—</span></td>`;
}
function renderVentas(){
  const cont=document.getElementById('ventas-body'); cont.innerHTML='';
  Object.entries(PAISES).forEach(([pais,p])=>{
    const block=document.createElement('div'); block.className='pais-block';
    const filas=S.lineas.filter(l=>l.pais===pais).map(l=>`<tr id=&quot;lr-${lineaKey(l)}&quot;>${lineaRowHTML(l)}</tr>`).join('');
    block.innerHTML=`
      <div class=&quot;pais-block-head&quot;><span class=&quot;pbh-flag&quot;>${p.flag}</span> ${p.nombre} <span class=&quot;pbh-cur&quot;>· captura en ${p.captura==='uf'?'UF':p.moneda}</span></div>
      <div class=&quot;table-scroll&quot;>
        <table class=&quot;ventas-table&quot;>
          <thead><tr>
            <th>Plan</th><th class=&quot;r&quot;>Precio mensual</th><th class=&quot;r&quot;>≈ equiv.</th>
            <th class=&quot;r&quot;>Mensual<br><span class=&quot;th-sub&quot;>suc.</span></th>
            <th class=&quot;r&quot;>Semestral<br><span class=&quot;th-sub&quot;>suc. × meses</span></th>
            <th class=&quot;r&quot;>Anual<br><span class=&quot;th-sub&quot;>suc. × meses</span></th>
            <th class=&quot;r&quot;>Implem.</th><th class=&quot;r&quot;>Comisión <span class=&quot;com-head-unit&quot;>UF</span></th>
          </tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>`;
    cont.appendChild(block);
  });
}
function updL(key,field,val){
  const l=getLinea(key); if(!l) return;
  l[field]=val;
  if(field==='monto'){ const el=document.getElementById('eq-'+key); if(el) el.textContent=equivTxt(l); }
  recalc();
}

// ═══════════════════════════════════
//  RENDER · AJUSTES
// ═══════════════════════════════════
function renderAjustes(){
  const c=document.getElementById('ajustes-body');
  if(S.ajustes.length===0){ c.innerHTML=`<div class=&quot;empty-row&quot; style=&quot;text-align:left&quot;>Sin bajas registradas.</div>`; return; }
  c.innerHTML='';
  S.ajustes.forEach(a=>{
    const row=document.createElement('div'); row.className='aj-row'; row.id='ar-'+a.id;
    row.innerHTML=`
      <input class=&quot;txt-input&quot; type=&quot;text&quot; placeholder=&quot;Cliente / motivo de la baja&quot; value=&quot;${a.concepto.replace(/&quot;/g,'&amp;quot;')}&quot; oninput=&quot;updA(${a.id},'concepto',this.value)&quot;>
      <div class=&quot;aj-uf&quot;><span>−UF</span><input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;${a.uf||''}&quot; placeholder=&quot;0&quot; oninput=&quot;updA(${a.id},'uf',this.value)&quot;></div>
      <button class=&quot;btn-del&quot; onclick=&quot;delA(${a.id})&quot; title=&quot;Eliminar&quot;>✕</button>`;
    c.appendChild(row);
  });
}
function addAjuste(){ S.ajustes.push(nuevoAjuste()); renderAjustes(); recalc(); }
function delA(id){ S.ajustes=S.ajustes.filter(a=>a.id!==id); renderAjustes(); recalc(); }
function updA(id,field,val){ const a=S.ajustes.find(x=>x.id===id); if(a){ a[field]=val; recalc(); } }

// ═══════════════════════════════════
//  RENDER · RESULTADO
// ═══════════════════════════════════
function uf(n){ return 'UF '+ (Math.round(n*100)/100).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function renderResultado(C){
  // readouts por línea (comisión en moneda del comercial + equivalencia)
  S.lineas.forEach(l=>{ const key=lineaKey(l);
    const el=document.getElementById('cm-'+key); if(el){ const c=C.porLinea[key]; el.textContent = c>0 ? comMon(c) : '—'; }
    const eq=document.getElementById('eq-'+key); if(eq) eq.textContent=equivTxt(l);
  });
  // encabezado dinámico de la columna comisión
  const unit=(PAISES[S.paisComercial]||PAISES.cl); const unitTxt=unit.captura==='uf'?'UF':unit.moneda;
  document.querySelectorAll('.com-head-unit').forEach(e=>e.textContent=unitTxt);

  const alcPct = C.alcance*100;
  const alcCls = alcPct<80?'lo':(alcPct<=120?'mid':'hi');
  const tramoTxt = C.pct===0.25?'Tramo <80% · 25%':(C.pct===0.50?'Tramo 80–120% · 50%':'Tramo >120% · 60%');

  const pc=PAISES[S.paisComercial]||PAISES.cl;
  const esUFcom = pc.captura==='uf';
  const refUF=(v)=>esUFcom?'':` <span class=&quot;uf-ref&quot;>(UF ${ufFmt(v)})</span>`;

  const rows=[];
  rows.push(`<div class=&quot;drow&quot;><span>Servicio mensual (recurrente × ${(C.pct*100).toFixed(0)}%)</span><span class=&quot;dv&quot;>${comMon(C.comMensual)}</span></div>`);
  if(C.comContratos>0) rows.push(`<div class=&quot;drow&quot;><span>Contratos (anual 10% / semestral 5%)</span><span class=&quot;dv&quot;>${comMon(C.comContratos)}</span></div>`);

async function cargarHistorial(){
  if(!sb || !S.perfil){ return; }
  const { data, error } = await sb.from('liquidaciones').select('*').eq('activa',true).order('anio',{ascending:false}).order('trimestre',{ascending:false});
  const cont=document.getElementById('hist-body');
  if(error){ cont.innerHTML='<div class=&quot;empty-row&quot; style=&quot;text-align:left&quot;>Error: '+error.message+'</div>'; return; }
  if(!data || !data.length){ cont.innerHTML='<div class=&quot;empty-row&quot; style=&quot;text-align:left&quot;>Aún no hay liquidaciones. Registra tus ventas y guarda tu trimestre en curso.</div>'; return; }
  const filas=data.map(r=>{
    const com=montoEnPais(r.pais_comercial||'cl', r.comision_uf||0);
    const est=r.estado||'borrador';
    const estHTML='<span class=&quot;est '+est+'&quot;>'+(ESTADOS[est]?ESTADOS[est].t:est)+'</span>';
    const fp=r.fecha_pago?r.fecha_pago:(r.fecha_aceptacion?('acep. '+r.fecha_aceptacion):'—');
    const dj=JSON.stringify(r.datos||{}).replace(/'/g,&quot;&amp;#39;&quot;);
    let acc='';
    if(ADMIN){
      acc+='<button class=&quot;btn-mini&quot; onclick=\'cargarLiquidacion('+dj+',true)\'>👁️ Ver</button> ';
      if(est==='borrador') acc+='<button class=&quot;btn-mini&quot; onclick=&quot;accionEstado(\''+r.id+'\',\'generada\')&quot;>Generar</button> ';
      if(est==='generada'||est==='aceptada') acc+='<button class=&quot;btn-mini green&quot; onclick=&quot;accionEstado(\''+r.id+'\',\'pagada\')&quot;>Marcar pagada</button> ';
      acc+='<button class=&quot;btn-mini red&quot; onclick=&quot;eliminarLiq(\''+r.id+'\',\''+(r.trimestre||'')+'\',\''+(r.comercial_email||'')+'\')&quot;>🗑 Eliminar</button> ';
    } else {
      if(est==='borrador'){ acc+='<button class=&quot;btn-mini&quot; onclick=\'cargarLiquidacion('+dj+',false)\'>✏️ Editar</button> '; }
      else { acc+='<button class=&quot;btn-mini&quot; onclick=\'cargarLiquidacion('+dj+',true)\'>👁️ Ver</button> '; }
      if(est==='generada') acc+='<button class=&quot;btn-mini green&quot; onclick=&quot;accionEstado(\''+r.id+'\',\'aceptada\')&quot;>✓ Aceptar</button> ';
    }
    return '<tr>'+
      (ADMIN?'<td>'+(r.comercial_email||'')+'</td>':'')+
      '<td>'+(r.trimestre||'')+'</td>'+
      '<td>'+((PAISES[r.pais_comercial]||{}).flag||'')+' '+((PAISES[r.pais_comercial]||{}).nombre||r.pais_comercial||'')+'</td>'+
      '<td class=&quot;r&quot;>UF '+ufFmt(r.venta_total_uf||0)+'</td>'+
      '<td class=&quot;r&quot;>'+com+'</td>'+
      '<td>'+estHTML+'</td>'+
      '<td>'+fp+'</td>'+
      '<td class=&quot;r&quot;>'+acc+'</td>'+
      '</tr>';
  }).join('');
  cont.innerHTML='<div class=&quot;hist-scroll&quot;><table class=&quot;hist-table&quot;><thead><tr>'+
    (ADMIN?'<th>Comercial</th>':'')+
    '<th>Trimestre</th><th>País</th><th class=&quot;r&quot;>Venta</th><th class=&quot;r&quot;>Comisión</th><th>Estado</th><th>Fecha</th><th class=&quot;r&quot;>Acciones</th>'+
    '</tr></thead><tbody>'+filas+'</tbody></table></div>';
}

async function eliminarLiq(id,trim,email){
  if(!esAdmin()){ return; }
  if(!confirm('¿Deshabilitar la liquidación '+(trim||'')+' de '+(email||'')+'?\n\nNo se borra: queda inactiva y podrás generar otra para ese trimestre.')) return;
  const { error } = await sb.from('liquidaciones').update({activa:false}).eq('id',id);
  if(error){ histMsg('Error: '+error.message,false); return; }
  histMsg('Liquidación '+(trim||'')+' deshabilitada.',true);
  cargarHistorial();
}
async function accionEstado(id,nuevo){
  const upd={estado:nuevo};
  if(nuevo==='pagada') upd.fecha_pago=new Date().toISOString().slice(0,10);
  const { error } = await sb.from('liquidaciones').update(upd).eq('id',id);
  if(error){ histMsg('Error: '+error.message,false); return; }
  histMsg('Estado actualizado: '+(ESTADOS[nuevo]?ESTADOS[nuevo].t:nuevo),true);
  cargarHistorial();
}

function cargarLiquidacion(datos, ro){
  if(!datos) return;
  setDatos(datos);
  document.getElementById('panel-hero').classList.add('hidden');
  mostrarEditor(true);
  setReadOnly(!!ro);
  if(!ro &amp;&amp; !ADMIN) lockParams(true);
  if(ro) banner('🔒 Viendo <b>'+(S.periodo||'')+'</b> (solo lectura). ', false);
  else if(!ADMIN) banner('✏️ Editando <b>'+(S.periodo||'')+'</b>. ', true);
  else banner('');
  window.scrollTo({top:0,behavior:'smooth'});
}

// ═══════════════════════════════════
//  INIT
// ═══════════════════════════════════
renderTasas();
construirLineas();
renderVentas();
renderAjustes();
recalc();
initAuth();
</script>

<script>
const SB_URL='https://hjcggilmjxhvxocloxgv.supabase.co';
const SB_KEY='sb_publishable_fb51sssWffX_SziOSEtILQ_WVAk301S';
const PAIS={cl:{f:'🇨🇱',n:'Chile'},pe:{f:'🇵🇪',n:'Perú'},co:{f:'🇨🇴',n:'Colombia'}};
const ESTADOS={borrador:'En curso',generada:'Por validar',aceptada:'Aceptada',pagada:'Pagada'};
let sb=null, YO=null, DATOS=[], PERFILES={}, EXPANDED=null;
try{ sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}); }catch(e){}

function uf(n){ return 'UF '+ (Math.round((n||0)*100)/100).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function qLabel(d){ const r=['I','II','III','IV'][Math.floor(d.getMonth()/3)]; return r+'-'+d.getFullYear(); }
function last4(){ const out=[]; let d=new Date(); d=new Date(d.getFullYear(),d.getMonth(),1); for(let i=0;i<4;i++){ out.push(qLabel(d)); d=new Date(d.getFullYear(),d.getMonth()-3,1);} return out; }

async function init(){
  if(!sb){ return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ document.getElementById('no-admin').classList.remove('hidden'); document.querySelector('#no-admin p').textContent='Inicia sesión en la suite.'; return; }
  const { data:perfil } = await sb.from('perfiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!perfil || perfil.rol!=='admin'){ document.getElementById('no-admin').classList.remove('hidden'); return; }
  YO=perfil; document.getElementById('app').classList.remove('hidden');
  await cargar();
}
if(sb){ sb.auth.onAuthStateChange((e,s)=>{ if(s &amp;&amp; !YO) init(); }); }

async function cargar(){
  const [{data:liq=[]},{data:perfiles=[]}] = await Promise.all([
    sb.from('liquidaciones').select('*').eq('activa',true),
    sb.from('perfiles').select('*')
  ]);
  DATOS=liq; PERFILES={}; perfiles.forEach(p=>PERFILES[p.id]=p);
  const sel=document.getElementById('q-comercial');
  const actual=sel.value;
  sel.innerHTML='<option value=&quot;&quot;>Todos los comerciales</option>'+perfiles.filter(p=>p.rol==='vendedor'||liq.some(l=>l.perfil_id===p.id)).map(p=>'<option value=&quot;'+p.id+'&quot;>'+(p.nombre||p.email)+'</option>').join('');
  sel.value=actual;
  render();
}

function metaDe(perfilId){ const p=PERFILES[perfilId]; return p&amp;&amp;p.meta_uf!=null?Number(p.meta_uf):30; }

function render(){
  const term=(document.getElementById('q-search').value||'').toLowerCase();
  const comId=document.getElementById('q-comercial').value;
  let rows=DATOS.slice();
  if(comId) rows=rows.filter(r=>r.perfil_id===comId);
  if(term) rows=rows.filter(r=>((r.comercial_email||'')+' '+(r.trimestre||'')+' '+((PERFILES[r.perfil_id]||{}).nombre||'')).toLowerCase().includes(term));

  // Dashboard últimos 4 trimestres
  const qs=last4();
  const dash=document.getElementById('dash');
  dash.innerHTML=qs.map(q=>{
    const qr=rows.filter(r=>r.trimestre===q);
    const venta=qr.reduce((s,r)=>s+(r.venta_total_uf||0),0);
    let metaTot;
    if(comId){ metaTot=metaDe(comId); } else { metaTot=qr.reduce((s,r)=>s+metaDe(r.perfil_id),0); }
    const alc=metaTot>0?(venta/metaTot*100):0;
    const bar=alc>120?'#86efac':(alc>=80?'#f5c518':'#fca5a5');
    return '<div class=&quot;q-card&quot;><div class=&quot;q-t&quot;>'+q+'</div>'+
      '<div class=&quot;q-v&quot;>'+uf(venta)+'</div><div class=&quot;q-l&quot;>Ventas generadas</div>'+
      '<div class=&quot;q-bar&quot;><div style=&quot;width:'+Math.min(alc,100)+'%;background:'+bar+'&quot;></div></div>'+
      '<div class=&quot;q-alc&quot;>Alcance '+(metaTot>0?alc.toLocaleString('es-CL',{maximumFractionDigits:0})+'%':'—')+'</div></div>';
  }).join('');
  document.getElementById('dash-scope').textContent = comId ? ('Comercial: '+((PERFILES[comId]||{}).nombre||(PERFILES[comId]||{}).email)) : 'Todos los comerciales (ventas sumadas; alcance vs. metas asignadas).';

  // Tabla
  rows.sort((a,b)=>(b.anio||0)-(a.anio||0) || String(b.trimestre).localeCompare(String(a.trimestre)));
  const cont=document.getElementById('tabla');
  if(!rows.length){ cont.innerHTML='<div class=&quot;empty&quot;>Sin liquidaciones para el filtro.</div>'; return; }
  const body=rows.map(r=>{
    const p=PERFILES[r.perfil_id]||{}; const est=r.estado||'borrador';
    const pais=PAIS[r.pais_comercial]||{f:'',n:r.pais_comercial||''};
    const meta=metaDe(r.perfil_id); const alc=meta>0?(r.venta_total_uf/meta*100):0;
    let acc='<button class=&quot;btn-mini&quot; onclick=&quot;toggleDet(\''+r.id+'\')&quot;>👁️ Ver</button>';
    if(est==='borrador') acc+='<button class=&quot;btn-mini&quot; onclick=&quot;setEstado(\''+r.id+'\',\'generada\')&quot;>Generar</button>';
    if(est==='generada'||est==='aceptada') acc+='<button class=&quot;btn-mini green&quot; onclick=&quot;setEstado(\''+r.id+'\',\'pagada\')&quot;>Pagar</button>';
    acc+='<button class=&quot;btn-mini red&quot; onclick=&quot;eliminar(\''+r.id+'\',\''+(r.trimestre||'')+'\',\''+(r.comercial_email||'')+'\')&quot;>🗑</button>';
    let row='<tr>'+
      '<td>'+(p.nombre||r.comercial_email||'')+'<br><span style=&quot;color:var(--g400);font-size:11px&quot;>'+(r.comercial_email||'')+'</span></td>'+
      '<td>'+(r.trimestre||'')+'</td>'+
      '<td>'+pais.f+' '+pais.n+'</td>'+
      '<td class=&quot;r&quot;>'+uf(r.venta_total_uf)+'</td>'+
      '<td class=&quot;r&quot;>'+(meta>0?alc.toLocaleString('es-CL',{maximumFractionDigits:0})+'%':'—')+'</td>'+
      '<td class=&quot;r&quot;>'+uf(r.comision_uf)+'</td>'+
      '<td><span class=&quot;est '+est+'&quot;>'+(ESTADOS[est]||est)+'</span></td>'+
      '<td>'+(r.fecha_pago||(r.fecha_aceptacion?('acep. '+r.fecha_aceptacion):'—'))+'</td>'+
      '<td class=&quot;r&quot;>'+acc+'</td></tr>';
    if(EXPANDED===r.id){ row+=detalleRow(r); }
    return row;
  }).join('');
  cont.innerHTML='<table><thead><tr><th>Comercial</th><th>Trimestre</th><th>País</th><th class=&quot;r&quot;>Venta</th><th class=&quot;r&quot;>Alcance</th><th class=&quot;r&quot;>Comisión</th><th>Estado</th><th>Fecha</th><th class=&quot;r&quot;>Acciones</th></tr></thead><tbody>'+body+'</tbody></table>';
}

function detalleRow(r){
  const d=r.datos||{}; const lineas=(d.lineas||[]).filter(l=>(parseFloat(l.sucM)||0)+(parseFloat(l.sucS)||0)+(parseFloat(l.sucA)||0)>0||(parseFloat(l.impl)||0)>0);
  const planN={basic:'Basic',plus:'Plus',max:'Max',otro:'Otro'};
  const lis=lineas.length?lineas.map(l=>{const pa=PAIS[l.pais]||{f:'',n:l.pais};const suc=(parseFloat(l.sucM)||0)+(parseFloat(l.sucS)||0)+(parseFloat(l.sucA)||0);return '<div class=&quot;det-line&quot;>'+pa.f+' '+pa.n+' · '+(planN[l.plan]||l.plan)+' · '+suc+' suc. (M'+(l.sucM||0)+'/S'+(l.sucS||0)+'/A'+(l.sucA||0)+')</div>';}).join(''):'<div class=&quot;det-line&quot;>Sin líneas registradas.</div>';
  return '<tr class=&quot;detalle&quot;><td colspan=&quot;9&quot;><div class=&quot;det-grid&quot;><div><span class=&quot;k&quot;>Meta</span><br>'+uf(metaDe(r.perfil_id))+'</div><div><span class=&quot;k&quot;>Venta</span><br>'+uf(r.venta_total_uf)+'</div><div><span class=&quot;k&quot;>Comisión</span><br>'+uf(r.comision_uf)+'</div><div><span class=&quot;k&quot;>Moneda pago</span><br>'+(r.moneda||'UF')+'</div></div><div style=&quot;margin-top:10px&quot;><b style=&quot;font-size:12px;color:var(--p600)&quot;>Ventas registradas</b>'+lis+'</div></td></tr>';
}
function toggleDet(id){ EXPANDED=EXPANDED===id?null:id; render(); }

async function setEstado(id,nuevo){
  const upd={estado:nuevo}; if(nuevo==='pagada') upd.fecha_pago=new Date().toISOString().slice(0,10);

<script>
const SB_URL='https://hjcggilmjxhvxocloxgv.supabase.co';
const SB_KEY='sb_publishable_fb51sssWffX_SziOSEtILQ_WVAk301S';
const PAIS={cl:'🇨🇱 Chile',pe:'🇵🇪 Perú',co:'🇨🇴 Colombia'};
let sb=null, YO=null;
try{ sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}); }catch(e){ console.error(e); }

function msg(id,t,ok){ const el=document.getElementById(id); if(!el)return; el.textContent=t; el.style.color=ok===false?'var(--red)':(ok?'var(--green)':'var(--g600)'); }
function selPais(val,onchg){ const o=['<option value=&quot;&quot;>—</option>']; for(const k in PAIS){ o.push('<option value=&quot;'+k+'&quot;'+(val===k?' selected':'')+'>'+PAIS[k]+'</option>'); } return '<select class=&quot;sel&quot; onchange=&quot;'+onchg+'&quot;>'+o.join('')+'</select>'; }
function selRol(val,onchg){ return '<select class=&quot;sel&quot; onchange=&quot;'+onchg+'&quot;><option value=&quot;vendedor&quot;'+(val==='vendedor'?' selected':'')+'>Vendedor</option><option value=&quot;admin&quot;'+(val==='admin'?' selected':'')+'>Admin</option></select>'; }

async function init(){
  if(!sb){ return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ document.getElementById('no-admin').classList.remove('hidden'); document.querySelector('#no-admin p').textContent='Inicia sesión en la suite para administrar usuarios.'; return; }
  const { data:perfil } = await sb.from('perfiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!perfil || perfil.rol!=='admin'){ document.getElementById('no-admin').classList.remove('hidden'); return; }
  YO=perfil;
  document.getElementById('app').classList.remove('hidden');
  cargar();
}

async function cargar(){
  const [{data:perfiles=[]},{data:autorizados=[]}] = await Promise.all([
    sb.from('perfiles').select('*').order('creado_en',{ascending:true}),
    sb.from('usuarios_autorizados').select('*').order('creado_en',{ascending:true})
  ]);
  // Registrados
  const pb=document.getElementById('perfiles-body');
  if(!perfiles.length){ pb.innerHTML='<div class=&quot;empty&quot;>Aún no hay usuarios registrados.</div>'; }
  else{
    pb.innerHTML='<table><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>País</th><th>Meta UF</th><th>Activo</th><th>Acciones</th></tr></thead><tbody>'+
      perfiles.map(p=>'<tr>'+
        '<td>'+p.email+(p.id===YO.id?' <span class=&quot;badge admin&quot;>tú</span>':'')+'</td>'+
        '<td>'+(p.nombre||'—')+'</td>'+
        '<td>'+selRol(p.rol,&quot;updPerfil('&quot;+p.id+&quot;','rol',this.value)&quot;)+'</td>'+
        '<td>'+selPais(p.pais,&quot;updPerfil('&quot;+p.id+&quot;','pais',this.value)&quot;)+'</td>'+
        '<td><input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.5&quot; value=&quot;'+(p.meta_uf!=null?p.meta_uf:'')+'&quot; placeholder=&quot;30&quot; style=&quot;width:72px;height:34px;border:1.5px solid var(--g200);border-radius:7px;padding:0 8px;font-size:13px;font-weight:700;outline:none&quot; onchange=&quot;updPerfil(\''+p.id+'\',\'meta_uf\',this.value===\'\'?null:parseFloat(this.value))&quot;></td>'+
        '<td><input type=&quot;checkbox&quot; class=&quot;chk&quot; '+(p.activo?'checked':'')+' onchange=&quot;updPerfil(\''+p.id+'\',\'activo\',this.checked)&quot;></td>'+
        '<td><button class=&quot;btn-mini red&quot; onclick=&quot;eliminarPerfil(\''+p.id+'\',\''+p.email+'\')&quot;>Eliminar</button></td>'+
      '</tr>').join('')+'</tbody></table>';
  }
  // Pendientes (autorizados sin perfil)
  const emails=new Set(perfiles.map(p=>p.email));
  const pend=autorizados.filter(a=>!emails.has(a.email));
  const nb=document.getElementById('pend-body');
  if(!pend.length){ nb.innerHTML='<div class=&quot;empty&quot;>Sin pre-autorizados pendientes.</div>'; }
  else{
    nb.innerHTML='<table><thead><tr><th>Correo</th><th>Rol</th><th>País</th><th>Meta UF</th><th>Acciones</th></tr></thead><tbody>'+
      pend.map(a=>'<tr>'+
        '<td>'+a.email+'</td>'+
        '<td>'+selRol(a.rol,&quot;updAutorizado('&quot;+a.email+&quot;','rol',this.value)&quot;)+'</td>'+
        '<td>'+selPais(a.pais,&quot;updAutorizado('&quot;+a.email+&quot;','pais',this.value)&quot;)+'</td>'+
        '<td><input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.5&quot; value=&quot;'+(a.meta_uf!=null?a.meta_uf:'')+'&quot; placeholder=&quot;30&quot; style=&quot;width:72px;height:34px;border:1.5px solid var(--g200);border-radius:7px;padding:0 8px;font-size:13px;font-weight:700;outline:none&quot; onchange=&quot;updAutorizado(\''+a.email+'\',\'meta_uf\',this.value===\'\'?null:parseFloat(this.value))&quot;></td>'+
        '<td><button class=&quot;btn-mini red&quot; onclick=&quot;eliminarAutorizado(\''+a.email+'\')&quot;>Quitar</button></td>'+
      '</tr>').join('')+'</tbody></table>';
  }
}

async function crearUsuario(){
  const email=(document.getElementById('nu-email').value||'').trim().toLowerCase();
  const rol=document.getElementById('nu-rol').value;
  const pais=document.getElementById('nu-pais').value||null;
  const metaRaw=document.getElementById('nu-meta').value;
  const meta_uf = metaRaw===''?null:(parseFloat(metaRaw)||0);
  if(!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg('nu-msg','Ingresa un correo válido.',false); return; }
  msg('nu-msg','Guardando…');
  const { error } = await sb.from('usuarios_autorizados').upsert({email,rol,pais,meta_uf},{onConflict:'email'});
  if(error){ msg('nu-msg','Error: '+error.message,false); return; }
  // Si ya tiene perfil, actualizarlo también
  await sb.from('perfiles').update({rol,pais,meta_uf}).eq('email',email);
  msg('nu-msg','Usuario autorizado: '+email,true);
  document.getElementById('nu-email').value=''; document.getElementById('nu-meta').value='';
  cargar();
}

async function updPerfil(id,campo,valor){
  const upd={}; upd[campo]=valor;
  const { error } = await sb.from('perfiles').update(upd).eq('id',id);
  if(error){ alert('Error: '+error.message); cargar(); }
}

async function eliminarPerfil(id,email){
  if(!confirm('¿Eliminar el acceso de '+email+'? Podrá volver a ingresar solo si lo autorizas de nuevo.')) return;
  const { error } = await sb.from('perfiles').delete().eq('id',id);
  if(error){ alert('Error: '+error.message); return; }
  // quitar también de autorizados para que no reingrese
  await sb.from('usuarios_autorizados').delete().eq('email',email);
  cargar();
}

async function updAutorizado(email,campo,valor){
  const upd={}; upd[campo]=valor;
  const { error } = await sb.from('usuarios_autorizados').update(upd).eq('email',email);
  if(error){ alert('Error: '+error.message); cargar(); }
}
async function eliminarAutorizado(email){
  if(!confirm('¿Quitar la autorización de '+email+'?')) return;
  const { error } = await sb.from('usuarios_autorizados').delete().eq('email',email);
  if(error){ alert('Error: '+error.message); return; }
  cargar();
}

if(sb){ sb.auth.onAuthStateChange((e,s)=>{ if(s &amp;&amp; !YO) init(); }); }
init();
</script>
